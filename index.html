<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a1f">
<title>Prière Sacrée du Roi Salomon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: one slim phone-width column over a fixed starry sky. Each screen carries one main action; everything else is one tap away. */
:root{
  color-scheme:dark;
  --bg:#120a1f; --ink:#ffffff; --soft:rgba(234,222,242,.82); --line:rgba(222,200,236,.2); --panel:rgba(46,28,70,.55);
  --card:#2b1a42; --card-line:rgba(222,200,236,.22); --on-card:#ffffff; --on-card-soft:rgba(234,222,242,.85);
  --btn:#dcc084; --on-btn:#120a1f; --accent:#dcc084; --badge:rgba(14,8,26,.6);
  --ok:#74d3a0; --go1:#149364; --go2:#07583a; --bo:#6fe3c1; --bo-deep:#0c6f63; --bo1:#15504d; --bo2:#0b2c33; --paper:#f8f5ee; --ivory:#efe9dc; --ivory-ink:#241634; --ivory-gold:#876618;
  --display:"Cormorant Garamond",Georgia,serif; --body:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;margin:0;padding:0}
body{overflow-x:clip}
@supports (height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#sky{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(60% 38% at 100% 0%,rgba(96,52,150,.6),transparent 70%),
  radial-gradient(55% 36% at 0% 100%,rgba(78,40,124,.5),transparent 70%),var(--bg)}
#sky canvas{position:absolute;inset:0;width:100%;height:100%}
#sky::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 34% at 50% 104%,rgba(220,192,132,.2),transparent 70%);animation:aura 9s ease-in-out infinite alternate}
@keyframes aura{from{opacity:.35}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheen{0%,72%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes glow{from{filter:drop-shadow(0 0 3px rgba(220,192,132,.35))}to{filter:drop-shadow(0 0 12px rgba(220,192,132,.9))}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.enter>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.enter>*:nth-child(2){animation-delay:.07s}.enter>*:nth-child(3){animation-delay:.14s}.enter>*:nth-child(4){animation-delay:.21s}
.enter>*:nth-child(5){animation-delay:.28s}.enter>*:nth-child(n+6){animation-delay:.35s}
#app{position:relative;z-index:1;max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
main{flex:1;min-height:0;overflow-y:auto;padding-block:24px 28px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
main::-webkit-scrollbar,.login::-webkit-scrollbar{display:none}
main>*{flex-shrink:0}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;line-height:1.1;text-wrap:balance}
h1{font-size:32px} h2{font-size:25px} h3{font-size:21px} p{margin:0}
em{font-style:italic;font-weight:500;color:var(--accent)}
.eyebrow{display:block;font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.soft{color:var(--soft)} .small{font-size:13px} .center{text-align:center}
.head{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:14px} .grow{flex:1;min-width:0}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* brand */
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--accent)}
.brand>svg{width:30px;height:30px;animation:glow 3.5s ease-in-out infinite alternate}
.wordmark{font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;line-height:1}
.rule{width:44px;height:1px;background:var(--accent)}
.topbar{display:flex;align-items:center;justify-content:space-between;color:var(--accent)}
.topbar .mark{display:flex;align-items:center;gap:8px}
.topbar .wordmark{font-size:15px;letter-spacing:.2em}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);font-weight:900;display:grid;place-items:center}
.welcome{font-size:30px;text-align:center;text-shadow:0 0 26px rgba(222,200,250,.45);margin-block:6px 2px}
/* cards */
.hc{display:flex;flex-direction:column;gap:16px;width:100%;padding:18px;border-radius:10px;background:var(--card);color:var(--on-card);border:1px solid var(--card-line);box-shadow:0 0 34px rgba(214,186,250,.09)}
.hc .s{color:var(--on-card-soft);font-size:13px;display:block}
.hc.hero{padding:22px 18px;gap:18px;border-color:var(--accent);box-shadow:0 0 44px rgba(220,192,132,.2)}
.hc.banner{position:relative;padding:0;gap:0;min-height:330px;justify-content:flex-end;overflow:hidden;background:var(--card) center 10%/cover no-repeat}
.hc.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,7,22,0) 28%,rgba(12,7,22,.78) 58%,rgba(12,7,22,.97) 82%)}
.hc.banner>*{position:relative}
.btxt{display:flex;flex-direction:column;gap:5px;padding:0 18px 14px}
.btxt h2{font-size:27px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.hc.banner .access{margin:0 18px 18px;padding:15px}
.med{flex:none;width:60px;height:60px;border-radius:50%;background:var(--badge) no-repeat;box-shadow:0 0 0 1.5px var(--card-line);display:grid;place-items:center;color:var(--accent)}
.badge{display:inline-block;align-self:flex-start;padding:3px 9px;border-radius:999px;background:var(--badge);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.access{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:8px;background:linear-gradient(180deg,#9a6ae0 0%,#6b3fb0 48%,#45207e 100%);color:#fff;font-weight:900;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(240,216,150,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(40,14,70,.45),0 6px 20px rgba(150,90,220,.42);text-shadow:0 1px 2px rgba(34,10,60,.65);position:relative;overflow:hidden}
.access svg{width:17px;height:17px;stroke-width:2;color:#f6dfa0}
.access::after,.btn.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.4) 50%,transparent 62%);transform:translateX(-130%);animation:sheen 5.5s ease-in-out infinite}
.ivory{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 20px;border-radius:10px;background:var(--ivory);color:var(--ivory-ink);
  outline:1px solid rgba(150,116,40,.45);outline-offset:-7px;box-shadow:0 0 34px rgba(214,186,250,.14),0 0 60px rgba(220,192,132,.16)}
.ivory h2{font-size:23px;letter-spacing:.05em;text-transform:uppercase}
.ivory .rule{background:var(--ivory-gold)}
.ivory .ref{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.3;border-top:1px solid rgba(150,116,40,.35);padding-top:12px;width:100%}
.ivory .ref b{display:block;font-family:var(--body);font-style:normal;font-weight:900;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ivory-gold);margin-top:4px}
.mc{display:flex;align-items:center;gap:14px;width:100%;padding:15px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.mc.done{opacity:.6}
.mc .eyebrow{font-size:10px;letter-spacing:.14em}
.mc .t{display:block;font-weight:700;font-size:15px}
.mc .s{display:block;font-size:13px;color:var(--soft)}
.hc,.mc,.btn,.access,.chip{transition:transform .15s,border-color .25s,box-shadow .25s}
button.hc:hover,button.mc:hover{border-color:rgba(220,192,132,.6);box-shadow:0 0 32px rgba(220,192,132,.14)}
button.hc:active,button.mc:active,.btn:active{transform:scale(.985)}
.tile{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);color:var(--accent);display:grid;place-items:center}
.chev{flex:none;color:var(--accent);display:grid;place-items:center}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px 18px;border-radius:6px;font-weight:900;font-size:14px;background:var(--card);color:var(--on-card);border:1px solid var(--card-line)}
.btn.line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.gold{background:linear-gradient(90deg,#ecd28a,#b98f3c);color:var(--on-btn);border:0;letter-spacing:.14em;text-transform:uppercase;font-size:13px;padding:16px;box-shadow:0 8px 26px rgba(220,192,132,.28);position:relative;overflow:hidden}
.btn.gold[disabled]{opacity:.75}
.linkbtn{font-size:13px;color:var(--soft);text-decoration:underline;text-underline-offset:3px;align-self:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:22px}
details.panel summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
details.panel[open] summary::after{content:"–"}
.field{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.inp{position:relative;display:block}
.inp svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--accent)}
.field .inp input{padding-left:42px}
.inp input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(220,192,132,.18)}
.bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.back{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;color:var(--soft);font-weight:700;font-size:14px}
.back svg{width:18px;height:18px;transform:rotate(180deg)}
.video{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:#000 center 30%/cover no-repeat;display:grid;place-items:center;position:relative;overflow:hidden}
.video::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}
.playbtn{position:relative;width:60px;height:60px;border-radius:50%;background:var(--btn);color:var(--on-btn);display:grid;place-items:center}
.playbtn svg{fill:currentColor;stroke:none}
.lesson{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border-top:1px solid var(--line)}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;color:transparent}
.dot svg{width:13px;height:13px;stroke-width:2.2}
.ok .dot{background:var(--accent);color:var(--bg)}
.lesson.cur{font-weight:900}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--panel)}
.chip.on{background:var(--card);color:var(--on-card);font-weight:700;border-color:var(--accent)}
.entry{border-top:1px solid var(--line);padding-top:12px}
.entry p{white-space:pre-wrap;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:11px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:11px;align-items:flex-start}
.list .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);font-size:12px;font-weight:900;display:grid;place-items:center}
.list .b{flex:none;color:var(--accent)}
/* Thème du mois : couverture, progression, cartes de leçons */
.thero{position:relative;margin-inline:-4px;min-height:430px;border-radius:18px;overflow:hidden;display:flex;align-items:flex-end;background:#1a0f2c center 30%/cover no-repeat;border:1px solid rgba(220,192,132,.45);box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 60px rgba(220,192,132,.14)}
.thero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,10,31,.05) 0%,rgba(18,10,31,.35) 32%,rgba(18,10,31,.92) 62%,#120a1f 100%)}
.thero-in{position:relative;display:flex;flex-direction:column;gap:12px;padding:22px 20px 20px;width:100%}
.tbadge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(18,10,31,.72);border:1px solid rgba(220,192,132,.55);color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tbadge svg.ic{width:13px;height:13px}
.thero h1{font-size:38px;line-height:1.02;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.thero .tsub{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.3;color:var(--accent)}
.tmeta{display:flex;flex-wrap:wrap;gap:8px}
.tmeta span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:rgba(14,8,26,.55);border:1px solid var(--line);font-size:12px;font-weight:700}
.tmeta svg.ic{width:14px;height:14px;color:var(--accent)}
.tprog{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:900;color:var(--soft)}
.tprog .bar{flex:1;height:6px;background:rgba(255,255,255,.14)}
.tprog .bar i{background:linear-gradient(90deg,#b98f3c,#ecd28a)}
.thero .btn.gold{gap:10px}
.thero .btn.gold svg.ic{width:18px;height:18px;fill:currentColor;stroke:none}
.tquote{font-family:var(--display);font-size:22px;line-height:1.35;text-align:center;padding:4px 8px;color:#fff}
.tquote::before,.tquote::after{content:"";display:block;width:44px;height:1px;background:var(--accent);margin:0 auto 14px}
.tquote::after{margin:14px auto 0}
.tlearn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tlearn li{list-style:none;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;line-height:1.35;font-weight:700}
.tlearn .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(220,192,132,.15);color:var(--accent)}
.tlearn .k svg.ic{width:16px;height:16px;stroke-width:2.2}
.tsec{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.tsec h2{font-size:30px}
.eps{display:flex;flex-direction:column;gap:18px}
.epc{border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#2b1a42,#23143b);border:1px solid var(--card-line);box-shadow:0 12px 34px rgba(0,0,0,.35);scroll-margin-top:16px}
.epc.on{border-color:var(--accent);box-shadow:0 0 0 1px rgba(220,192,132,.35),0 0 44px rgba(220,192,132,.22)}
.epthumb{position:relative;display:block;width:100%;aspect-ratio:16/9;background:#000 center/cover no-repeat}
.epthumb::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 40%,rgba(0,0,0,.6))}
.epnum{position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:999px;background:rgba(18,10,31,.75);color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.epseen{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--go1);color:#fff;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.epseen svg.ic{width:12px;height:12px;stroke-width:3}
.epdur{position:absolute;right:12px;bottom:12px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.7);font-size:12px;font-weight:700;color:#fff}
.epplay{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ecd28a,#b98f3c);color:var(--on-btn);box-shadow:0 0 0 8px rgba(220,192,132,.22),0 10px 30px rgba(0,0,0,.5);animation:pulse 2.4s ease-in-out infinite}
.epplay svg.ic{width:26px;height:26px;fill:currentColor;stroke:none;margin-left:4px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(220,192,132,.25),0 10px 30px rgba(0,0,0,.5)}50%{box-shadow:0 0 0 14px rgba(220,192,132,.06),0 10px 30px rgba(0,0,0,.5)}}
.epc:not(.seen) .epseen{display:none}
.epup{position:absolute;top:12px;right:12px;padding:5px 10px;border-radius:999px;background:linear-gradient(90deg,#ecd28a,#b98f3c);color:var(--on-btn);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;animation:pulse 2.4s ease-in-out infinite}
.vtbox{background:#000;min-height:120px}
.vtbox.vert{padding:12px 0;background:radial-gradient(80% 60% at 50% 30%,rgba(220,192,132,.18),transparent 70%),#07040c}
.epc.seen .epplay{animation:none;background:rgba(18,10,31,.75);color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.epv{position:relative;aspect-ratio:16/9;background:#000}
.epv video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.epbody{display:flex;flex-direction:column;gap:6px;width:100%;padding:16px 18px 18px;text-align:left}
.epbody .ept{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1;color:#fff}
.epbody .epd{font-size:13px;color:var(--soft)}
.epnext{display:flex;gap:10px;padding:0 18px 18px}
.epnext .btn{flex:1;padding:12px;font-size:12px}
.tdone{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px 18px;border-radius:16px;background:linear-gradient(135deg,var(--go1),var(--go2));border:1px solid rgba(116,211,160,.5)}
.tdone h3{font-size:26px}
.tcard{position:relative;display:flex;align-items:flex-end;width:100%;min-height:250px;border-radius:14px;overflow:hidden;text-align:left;background:#1a0f2c center 30%/cover no-repeat;border:1px solid rgba(111,227,193,.55);box-shadow:0 0 36px rgba(111,227,193,.14)}
.tcard::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,44,51,.0) 10%,rgba(11,44,51,.75) 55%,#0b2c33 100%)}
.tcard-in{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px;width:100%}
.tcard .eyebrow{color:var(--bo)}
.tcard .t{font-family:var(--display);font-size:27px;font-weight:600;line-height:1.05;color:#fff}
.tcard .s{font-size:13px;color:var(--on-card-soft)}
.tcard-cta{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:10px 16px;border-radius:999px;background:linear-gradient(90deg,#ecd28a,#b98f3c);color:var(--on-btn);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.tcard-cta svg.ic{width:14px;height:14px;fill:currentColor;stroke:none}
.tcard .new{position:absolute;top:14px;right:14px;padding:5px 10px;border-radius:999px;background:var(--accent);color:var(--on-btn);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;z-index:1}
/* Remboursement : bannière rouge (Accueil), carte (Programmes), procédure en 3 étapes */
.mc.rfd{position:relative;overflow:hidden;padding:18px 15px;color:#fff;background:linear-gradient(120deg,#e0483f 0%,#c3332d 55%,#a8241f 100%);border-color:rgba(255,150,140,.55);box-shadow:0 10px 28px rgba(200,50,45,.28)}
.mc.rfd .t{font-weight:900;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.mc.rfd .s{color:rgba(255,232,229,.92)}
.mc.rfd .tile{width:50px;height:50px;border-radius:14px;border:0;background:rgba(255,255,255,.18);color:#fff}
.mc.rfd .chev{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff}

.ntabs button.on{background:var(--card);border-color:var(--accent);color:var(--ink)}
.ntabs i,.nbtn i{display:inline-grid;place-items:center;color:var(--ok)}
.ntabs i svg,.nbtn i svg{width:14px;height:14px;stroke-width:2.6}
.numgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nbtn{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:14px;border:1px solid var(--card-line);background:var(--card);font:600 24px var(--display);font-variant-numeric:tabular-nums;color:var(--accent);text-align:center}
.nbtn.on{border-color:var(--accent);box-shadow:0 0 28px rgba(220,192,132,.35);color:#fff}
.nbtn i{position:absolute;top:5px;right:5px}
.nrev,.ftheme,.fdone,.ndone,.nclock{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;background:var(--card);border:1px solid var(--card-line);position:relative}
.nrev,.ftheme{border-color:var(--accent);box-shadow:0 0 40px rgba(220,192,132,.14)}
.nrev p,.ftheme p{color:var(--on-card-soft)}
.nrev .x{position:absolute;top:8px;right:8px;width:40px;height:40px;display:grid;place-items:center;color:var(--soft);font-size:16px;text-align:center}
.nrev .big{font:600 64px/1 var(--display);color:var(--accent)}
.nclock{align-items:center;text-align:center;gap:4px}
.nclock b{font:600 44px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.clist{display:flex;flex-direction:column;gap:10px}
.crow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.crow b{font:600 26px var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.crow h3{font-size:18px}
.nform{display:flex;flex-direction:column;gap:12px}
.dates{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px}
.dates input{width:100%;min-height:50px;text-align:center;border-radius:10px;border:1px solid var(--card-line);background:var(--card);font-size:18px;letter-spacing:.06em}
.dates input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(220,192,132,.18)}
.err{color:#ffb4a8;font-size:13px}
.ndone{align-items:center;text-align:center;gap:12px}
.ndone.ok{border-color:var(--accent);box-shadow:0 0 40px rgba(220,192,132,.2)}
.ndone .btn{max-width:320px}
.fdone{flex-direction:row;align-items:center;gap:14px;border-color:var(--ok)}
.fdone .ok{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ok);border:2px solid var(--ok)}
.fdone .ok svg{width:22px;height:22px;stroke-width:2.6}
.fdone b{display:block;font:600 19px/1.25 var(--display)}
.fopt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--card-line);background:var(--card);font-size:14.5px;line-height:1.3}
.fopt span{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--card-line);display:grid;place-items:center}
.fopt.on{border-color:var(--accent);background:rgba(220,192,132,.1)}
.fopt.on span{background:var(--accent);border-color:var(--accent);color:var(--on-btn)}
.fopt span svg{width:13px;height:13px;stroke-width:3}
#unlock blockquote{max-width:340px;text-align:left}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video video{object-fit:contain;background:#000;z-index:2}
.video .shield{position:absolute;top:0;right:0;width:22%;height:15%;z-index:3;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(18,10,31,.35)}
.soon{padding:16px;display:flex;flex-direction:column;gap:6px}
.lread{display:flex;flex-direction:column;gap:12px;padding:16px 16px 4px}
.lread>p{margin:0;font-size:16px;line-height:1.65;color:var(--on-card)}
.lverse{margin:4px 0;padding:14px 16px;border-left:3px solid var(--accent);background:rgba(220,192,132,.08);border-radius:0 12px 12px 0;font:italic 500 19px/1.45 var(--display);color:#f3dc98}
.lverse b{display:block;margin-top:6px;font:700 12px var(--body);letter-spacing:.08em;color:var(--accent);font-style:normal}
.lbox{padding:14px 16px;border-radius:12px;border:1px solid var(--card-line);background:rgba(255,255,255,.03)}
.lbox.pr{border-color:rgba(220,192,132,.5);background:linear-gradient(180deg,rgba(220,192,132,.12),rgba(220,192,132,.04))}
.lbox .eyebrow{display:flex;align-items:center;gap:6px}.lbox .eyebrow svg{width:14px;height:14px}
.lbox p{margin:8px 0 0;font-size:15.5px;line-height:1.6}
.lbox.pr p{font:500 19px/1.5 var(--display);color:#fbecc0}

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS={
 home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',

 spark:'<path d="M12 4l1.8 5.2L19 11l-5.2 1.8L12 18l-1.8-5.2L5 11l5.2-1.8z"/><path d="M18.5 4v3M17 5.5h3"/>',
 pray:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/><circle cx="12" cy="12" r="2.5"/>',
 gift:'<path d="M4 10h16v4H4zM6 14v6h12v-6M12 10v10M12 10c-2-4-6-3-5-1 .5 1 3 1 5 1zm0 0c2-4 6-3 5-1-.5 1-3 1-5 1z"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M9 10.5h6"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
 pen:'<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>',scroll:'<path d="M7 4h11v13a3 3 0 0 1-3 3H6a2 2 0 0 1-2-2v-2h10M10 9h5M10 12h5"/>',
 unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.600-1.700"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 check:'<path d="M5 12l4 4 10-10"/>',eye:'<path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',play:'<path d="M8 5l11 7-11 7z"/>',pause:'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>',
 send:'<path d="M4 12l16-7-6 16-3-6z"/>',card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>',support:'<path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19c0 1.500-2 2.500-5 2.500"/><path d="M9 10.500h.01M12 10.500h.01M15 10.500h.01"/>',chev:'<path d="M9 6l6 6-6 6"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',crown:'<path d="M4 8l4 4 4-7 4 7 4-4-2 10H6z"/>'
};
const GIFT='<svg class="gifto" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="9.500" rx="1.500" fill="#22a888"/><rect x="3" y="7.500" width="18" height="4.200" rx="1.200" fill="#57d6b2"/><rect x="10.600" y="7.500" width="2.800" height="13" fill="#f1d792"/><path d="M12 7.500C10 3.300 6.300 4.200 7.100 6.200 7.600 7.500 10 7.500 12 7.500zM12 7.500c2-4.200 5.700-3.300 4.900-1.300-.5 1.300-2.900 1.300-4.900 1.300z" fill="#ff8f7a"/></svg>';
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const tile=n=>`<span class="tile">${ic(n)}</span>`;
// one row component for every secondary item
const mc=(attrs,lead,t,s,cls='',end='chev',eb='')=>`<button class="mc ${cls}" ${attrs}>${lead}<span class="grow">${eb?`<span class="eyebrow">${esc(eb)}</span>`:''}<span class="t">${esc(t)}</span>${s?`<span class="s">${esc(s)}</span>`:''}</span><span class="chev">${ic(end)}</span></button>`;

/* ---------- content ---------- */
// video: code du lecteur vturb de chaque leçon (à renseigner). gift: programme offert par le pop-up des Prières royales.
const P=[
 // Programmes du Roi Salomon : leçons écrites (tx). Pour ajouter une vidéo vturb plus tard : vt:['id1','id2',…] (même ordre que l).
 {id:'sagesse',t:"La Prière de Sagesse du Roi Salomon",img:'img/sagesse.jpg',hero:'img/sagesse-hero.jpg',badge:'Programme royal · 5 leçons',
  sub:"La nuit où Dieu a dit à un jeune roi : « Demande ce que tu veux que je te donne. »",
  quote:"Salomon n'a pas demandé l'or. Il a demandé un cœur qui écoute — et l'or est venu avec.",
  learn:["La prière exacte de Salomon à Gabaon","L'humilité qui attire la faveur de Dieu","Discerner le bien du mal dans vos décisions","Un rituel du matin pour demander la sagesse"],
  l:["La nuit de Gabaon","« Je ne suis qu'un jeune homme »","Un cœur qui écoute","Ce que vous n'avez pas demandé","Prier comme Salomon, chaque matin"],
  d:["Le songe qui a changé la vie du jeune roi, et la question que Dieu vous pose aussi.","Pourquoi la faiblesse avouée ouvre la porte de la sagesse.","La demande la plus précieuse de la Bible, et comment la faire vôtre.","La surabondance que Dieu ajoute à ceux qui cherchent d'abord l'essentiel.","La prière complète à dire chaque matin, inspirée de Gabaon."],
  tx:[
   {p:["Salomon venait de devenir roi. Il était jeune, son père David était mort, et tout un peuple attendait de lui des réponses qu'il n'avait pas. Il monta à Gabaon pour offrir un sacrifice, puis il s'endormit.","Cette nuit-là, Dieu lui apparut en songe et lui dit : « Demande ce que tu veux que je te donne. » Imaginez cette phrase prononcée pour vous. Que demanderiez-vous, là, tout de suite ?","Cette leçon vous invite à prendre le temps de répondre honnêtement. Ce que nous demandons à Dieu révèle ce que nous croyons être essentiel. Salomon a pris le temps de réfléchir avant de répondre. Faites de même."],
    v:"À Gabaon, l'Éternel apparut en songe à Salomon pendant la nuit, et Dieu lui dit : Demande ce que tu veux que je te donne.",r:"1 Rois 3:5",
    pr:"Seigneur, comme à Salomon, tu me demandes ce que je désire. Aide-moi à voir clair dans mon cœur. Je ne veux pas te demander seulement ce qui passe, mais ce qui compte vraiment. Parle-moi cette nuit, et que je t'entende. Amen.",
    g:"Ce soir, avant de dormir, écrivez sur un papier : « Si Dieu me disait : demande… je demanderais : … ». Gardez ce papier près de votre lit."},
   {p:["La réponse de Salomon commence de façon surprenante. Au lieu de se présenter comme un roi puissant, il dit : « Je ne suis qu'un jeune homme, je ne sais pas me conduire. »","Il ne cache pas sa faiblesse. Il l'avoue devant Dieu. C'est exactement ce qui va ouvrir la porte. Dans la Bible, Dieu résiste aux orgueilleux, mais il fait grâce aux humbles.","Beaucoup d'entre nous prient en essayant de paraître forts. Salomon nous apprend l'inverse : la vraie prière commence par la vérité. Dites à Dieu ce que vous ne savez pas faire. C'est là que sa sagesse peut entrer."],
    v:"Maintenant, Éternel mon Dieu, tu as fait régner ton serviteur à la place de David, mon père ; et moi je ne suis qu'un jeune homme, je ne sais pas me conduire.",r:"1 Rois 3:7",
    pr:"Éternel, je ne vais pas faire semblant. Il y a des choses que je ne sais pas gérer, des situations qui me dépassent. Je te les présente avec humilité. Là où je suis faible, sois ma force et ma sagesse. Amen.",
    g:"Nommez à voix haute devant Dieu une situation où vous ne savez pas quoi faire. Ne demandez rien encore : avouez seulement que vous avez besoin de lui."},
   {p:["Puis vient la demande, l'une des plus belles de toute la Bible : « Accorde à ton serviteur un cœur intelligent pour juger ton peuple, pour discerner le bien du mal. »","En hébreu, l'expression signifie littéralement « un cœur qui écoute ». Salomon ne demande pas d'abord de l'intelligence pour parler, mais un cœur capable d'écouter : Dieu, les autres, la vérité.","Un cœur qui écoute prend de meilleures décisions, apaise les conflits et reconnaît les pièges. C'est cette qualité qui a fait de Salomon le roi le plus sage de son temps. Elle est disponible pour vous aujourd'hui."],
    v:"Accorde donc à ton serviteur un cœur intelligent pour juger ton peuple, pour discerner le bien du mal !",r:"1 Rois 3:9",
    pr:"Seigneur, donne-moi un cœur qui écoute. Que j'entende ta voix avant celle de mes peurs, que j'écoute les autres avant de les juger, et que je discerne le bien du mal dans chacune de mes décisions. Amen.",
    g:"Aujourd'hui, dans une conversation, écoutez jusqu'au bout sans interrompre. Puis demandez intérieurement : « Seigneur, que veux-tu me dire à travers cette personne ? »"},
   {p:["La demande de Salomon plut à Dieu. Et Dieu lui répondit : parce que tu n'as demandé ni une longue vie, ni la richesse, ni la mort de tes ennemis, je te donne un cœur sage et intelligent.","Mais Dieu ne s'arrête pas là : « Je te donnerai, de plus, ce que tu n'as pas demandé, des richesses et de la gloire. » Voilà le secret : quand on cherche d'abord l'essentiel, Dieu ajoute le reste.","Cela ne veut pas dire que Dieu méprise nos besoins matériels. Cela veut dire qu'il aime remettre les choses dans le bon ordre. La sagesse d'abord ; l'abondance ensuite, sans chagrin."],
    v:"Je te donnerai, de plus, ce que tu n'as pas demandé, des richesses et de la gloire.",r:"1 Rois 3:13",
    pr:"Éternel, je choisis de te chercher d'abord. Je te confie aussi mes besoins, car tu les connais. Remets de l'ordre dans mes priorités, et ajoute à ma vie ce que tu juges bon, même ce que je n'ai pas osé demander. Amen.",
    g:"Faites deux colonnes sur une feuille : « Ce que je demande » et « Ce que Dieu m'a donné sans que je le demande ». Remplissez surtout la deuxième."},
   {p:["Vous connaissez maintenant le cœur de la prière de Gabaon : l'écoute, l'humilité, la demande de sagesse et la confiance dans la générosité de Dieu.","Voici une prière à dire chaque matin, avant de commencer votre journée. Elle reprend les quatre mouvements de Salomon. Dites-la lentement, à voix basse ou à voix haute.","Faites-le pendant sept jours, et observez ce qui change dans vos décisions, vos paroles et votre paix. La sagesse ne tombe pas du ciel d'un coup : elle grandit chaque matin."],
    v:"Car l'Éternel donne la sagesse ; de sa bouche sortent la connaissance et l'intelligence.",r:"Proverbes 2:6",
    pr:"Éternel mon Dieu, tu m'as donné ce nouveau jour. Je ne suis qu'un enfant devant toi, je ne sais pas toujours me conduire. Accorde-moi un cœur qui écoute, pour discerner le bien du mal dans chaque décision d'aujourd'hui. Je te cherche d'abord, et je te confie tout le reste. Que ta sagesse guide mes pas, mes paroles et mes choix. Amen.",
    g:"Recopiez cette prière et placez-la là où vous la verrez chaque matin : sur votre table de nuit, votre miroir ou votre réfrigérateur."}
  ]},
 {id:'prosp',gift:1,t:"Les Secrets de la Prospérité du Roi Salomon",img:'img/prosp.jpg',hero:'img/prosp-hero.jpg',badge:'Programme royal · 7 secrets',
  sub:"Ce que l'homme le plus riche du monde a écrit sur l'argent, le travail et l'abondance.",
  quote:"C'est la bénédiction de l'Éternel qui enrichit, et il ne la fait suivre d'aucun chagrin.",
  learn:["Les 7 principes de prospérité des Proverbes","Attirer une abondance qui n'apporte pas de chagrin","Sortir de la peur du manque","Une prière de prospérité pour chaque secret"],
  l:["La source de toute richesse","Le secret des prémices","La main diligente","Peu à peu","La main qui arrose","La parole qui bâtit","La paix, trésor du roi"],
  d:["D'où vient vraiment l'abondance, selon Salomon.","Le principe qui remplit les greniers.","Pourquoi Dieu bénit ce que nous faisons, pas ce que nous rêvons.","La patience qui fait grandir solidement.","Le paradoxe de la générosité : celui qui donne reçoit.","Ce que vous dites de votre argent façonne votre avenir.","La richesse que même Salomon plaçait au-dessus de l'or."],
  tx:[
   {p:["Salomon a possédé plus d'or que n'importe quel roi de son époque. Pourtant, quand il écrit sur la richesse, il ne commence pas par des techniques : il commence par la source.","« C'est la bénédiction de l'Éternel qui enrichit. » Toute vraie prospérité commence par une relation : avec Dieu, qui donne la force de travailler, les idées, les rencontres et les portes ouvertes.","Et Salomon ajoute un détail précieux : cette richesse-là ne s'accompagne d'aucun chagrin. Elle ne détruit pas la famille, ne vole pas le sommeil, ne rend pas avide. C'est cette abondance-là que nous allons demander."],
    v:"C'est la bénédiction de l'Éternel qui enrichit, et il ne la fait suivre d'aucun chagrin.",r:"Proverbes 10:22",
    pr:"Éternel, tu es la source de toute bénédiction. Je ne veux pas d'une richesse qui m'éloigne de toi ou qui me coûte la paix. Bénis-moi de la bénédiction qui enrichit sans chagrin. Je reconnais que tout ce que j'ai vient de toi. Amen.",
    g:"Regardez votre portefeuille ou votre carte bancaire, posez la main dessus et dites : « Seigneur, tout ceci t'appartient. Bénis-le. »"},
   {p:["Le deuxième secret est simple et très ancien : honorer Dieu avec les prémices, c'est-à-dire la première part.","Dans l'Antiquité, on offrait les premiers fruits de la récolte avant même de savoir si la suite serait bonne. C'était un acte de confiance : « Dieu, je te donne d'abord, et je crois que tu pourvoiras. »","Aujourd'hui, les prémices peuvent être la première heure de votre journée, une part de votre revenu donnée avec joie, ou le premier merci du matin. Salomon promet que les greniers de celui qui agit ainsi seront remplis d'abondance."],
    v:"Honore l'Éternel avec tes biens, et avec les prémices de tout ton revenu : alors tes greniers seront remplis d'abondance, et tes cuves regorgeront de moût.",r:"Proverbes 3:9-10",
    pr:"Seigneur, je veux te donner la première place, pas les restes. Je t'offre les prémices de mon temps, de mon cœur et de mes biens. Je crois que tu sais remplir mes greniers. Apprends-moi à donner avec confiance. Amen.",
    g:"Demain matin, avant de regarder votre téléphone, offrez à Dieu les cinq premières minutes de votre journée en prière."},
   {p:["Le troisième secret parle de vos mains. « La main des diligents enrichit. » Le mot diligent veut dire attentif, soigneux, constant.","Dieu bénit ce que nous faisons, pas ce que nous rêvons de faire. Salomon ne promet rien à celui qui attend un miracle les bras croisés. Mais il promet beaucoup à celui qui fait sa part, même petite, chaque jour.","Votre part peut être modeste : ranger vos papiers, envoyer cette candidature, appeler ce client, préparer ce repas avec amour. La diligence transforme les petites choses en grandes bénédictions."],
    v:"Celui qui agit d'une main lâche s'appauvrit, mais la main des diligents enrichit.",r:"Proverbes 10:4",
    pr:"Éternel, bénis le travail de mes mains. Donne-moi la constance quand je suis fatigué et le courage quand je repousse ce qui doit être fait. Je fais ma part avec soin, et je te confie la tienne. Amen.",
    g:"Choisissez une tâche que vous repoussez depuis longtemps, et faites-la aujourd'hui, avec soin, en la dédiant à Dieu."},
   {p:["Le quatrième secret va à l'encontre de notre époque pressée : « Celui qui amasse peu à peu l'augmente. »","Salomon avait vu des fortunes rapides disparaître aussi vite qu'elles étaient venues. Il savait que ce qui grandit lentement grandit solidement. La richesse mal acquise ou trop rapide diminue.","Cette leçon vous libère de la pression des résultats immédiats. Un petit pas chaque jour, une petite économie chaque semaine, une petite fidélité chaque mois : voilà comment se bâtit une abondance durable."],
    v:"La richesse mal acquise diminue, mais celui qui amasse peu à peu l'augmente.",r:"Proverbes 13:11",
    pr:"Seigneur, garde-moi des promesses de richesse facile et des raccourcis dangereux. Apprends-moi la patience des bâtisseurs. Bénis mes petits pas et fais-les grandir avec le temps. Amen.",
    g:"Mettez de côté aujourd'hui une petite somme, même symbolique, dans une enveloppe ou une tirelire. Écrivez dessus : « Peu à peu ». "},
   {p:["Le cinquième secret est un paradoxe : « Celui qui arrose sera lui-même arrosé. » Dans la logique du monde, donner nous appauvrit. Dans la logique de Dieu, donner nous ouvre.","La générosité brise la peur du manque. Elle rappelle à notre cœur que nous ne sommes pas seuls à porter notre avenir. Et elle crée un mouvement : ce qui circule se multiplie.","Donner ne veut pas forcément dire donner beaucoup d'argent. Cela peut être votre temps, une écoute, un repas, un objet utile. Salomon promet que l'âme bienfaisante sera rassasiée."],
    v:"L'âme bienfaisante sera rassasiée, et celui qui arrose sera lui-même arrosé.",r:"Proverbes 11:25",
    pr:"Éternel, ouvre ma main. Libère-moi de la peur de manquer. Montre-moi aujourd'hui quelqu'un que je peux bénir, et je crois que tu prendras soin de moi, car celui qui arrose sera lui-même arrosé. Amen.",
    g:"Faites aujourd'hui un geste de générosité discret : un don, un service, un cadeau simple, sans le dire à personne."},
   {p:["Le sixième secret concerne votre bouche. « La mort et la vie sont au pouvoir de la langue. » Ce que vous répétez sur votre argent finit par façonner votre manière de le vivre.","« Je n'y arriverai jamais », « l'argent me fuit », « c'est toujours pour les autres » : ces phrases deviennent des murs. Salomon nous invite à prononcer des paroles de vie, alignées sur les promesses de Dieu.","Il ne s'agit pas de nier la réalité, mais de parler avec foi. « Dieu pourvoit », « je suis béni pour bénir », « mes efforts portent du fruit » : ces paroles ouvrent des portes."],
    v:"La mort et la vie sont au pouvoir de la langue ; quiconque l'aime en mangera les fruits.",r:"Proverbes 18:21",
    pr:"Seigneur, garde ma bouche. Je renonce aux paroles de découragement et de manque que j'ai prononcées sur ma vie. Aujourd'hui, je déclare que tu es mon pourvoyeur, que je suis béni pour bénir, et que mes efforts portent du fruit. Amen.",
    g:"Chaque fois que vous allez vous plaindre de l'argent aujourd'hui, arrêtez-vous et transformez la phrase en remerciement ou en prière."},
   {p:["Le dernier secret est celui que Salomon a découvert à la fin de sa vie, après avoir tout possédé : la paix vaut plus que la fortune.","« Mieux vaut peu, avec la crainte de l'Éternel, qu'un grand trésor, avec le trouble. » Le roi le plus riche du monde a écrit cette phrase. Il savait que l'or ne remplace ni l'amour, ni le sommeil, ni la présence de Dieu.","Ce secret couronne tous les autres. Demandez l'abondance, travaillez avec diligence, donnez avec joie, mais gardez toujours la paix comme votre vrai trésor. C'est là que commence la prospérité selon le cœur de Dieu."],
    v:"Mieux vaut peu, avec la crainte de l'Éternel, qu'un grand trésor, avec le trouble.",r:"Proverbes 15:16",
    pr:"Éternel, merci pour les sept secrets de ton serviteur Salomon. Je te demande une abondance qui apporte la paix, un travail béni, une main ouverte et une bouche qui prononce la vie. Mais par-dessus tout, garde-moi dans ta paix, mon plus grand trésor. Amen.",
    g:"Notez les 7 secrets sur une petite carte et relisez-la chaque dimanche pendant un mois."}
  ]},
 {id:'sceau',t:"Le Sceau Sacré de Protection",img:'img/sceau.jpg',hero:'img/sceau-hero.jpg',badge:'Programme royal · 4 prières',
  sub:"Les prières de Salomon pour placer votre vie, votre maison et votre cœur sous la garde de Dieu.",
  quote:"Un sceau royal disait : ceci appartient au roi, que personne n'y touche.",
  learn:["Se réfugier dans le Nom qui protège","Marcher protégé par l'intégrité","Confier sa maison au vrai bâtisseur","Recevoir le sceau de l'amour de Dieu"],
  l:["Le Nom, tour forte","Le bouclier des cœurs droits","La maison gardée","Le sceau sur le cœur"],
  d:["La prière-refuge à dire dès que la peur arrive.","La protection promise à ceux qui marchent dans la droiture.","Bénir sa maison avec le psaume de Salomon.","Être marqué du sceau de l'amour de Dieu."],
  tx:[
   {p:["Au temps de Salomon, chaque ville avait une tour forte. Quand l'ennemi approchait, les habitants y couraient. Les murs étaient épais, la porte solide : à l'intérieur, on était en sécurité.","Salomon écrit : « Le nom de l'Éternel est une tour forte. » Prononcer le Nom de Dieu avec foi, c'est entrer dans cette tour. Le danger ne disparaît pas forcément, mais il ne peut plus vous atteindre de la même manière.","Cette prière est faite pour les moments de peur : une mauvaise nouvelle, une nuit d'angoisse, une menace. Courez dans la tour."],
    v:"Le nom de l'Éternel est une tour forte ; le juste s'y réfugie, et se trouve en sûreté.",r:"Proverbes 18:10",
    pr:"Éternel, j'entre dans ta tour forte. Je me réfugie dans ton Nom avec tous ceux que j'aime. Que ni la peur, ni le mal, ni l'angoisse ne franchissent cette porte. En toi, je suis en sûreté. Amen.",
    g:"Apprenez ce verset par cœur aujourd'hui. Dès qu'une peur se présente, répétez-le trois fois lentement."},
   {p:["Salomon associe souvent la protection à la droiture. « Il est un bouclier pour ceux qui marchent dans l'intégrité. »","L'intégrité, c'est être le même à l'intérieur et à l'extérieur, en public et en privé. Ceux qui marchent ainsi n'ont rien à cacher, et donc moins de prises pour le mal.","Cette prière vous invite à remettre de l'ordre là où il le faut, et à demander à Dieu de garder vos pas. La droiture n'est pas la perfection : c'est la direction de votre cœur."],
    v:"Il tient en réserve le salut pour les hommes droits, il est un bouclier pour ceux qui marchent dans l'intégrité.",r:"Proverbes 2:7",
    pr:"Seigneur, sois mon bouclier. Garde mes pas sur le chemin droit, même quand le détour paraît facile. Montre-moi ce que je dois mettre en ordre, et protège-moi sur la route de l'intégrité. Amen.",
    g:"Réparez aujourd'hui une petite chose qui n'est pas droite dans votre vie : une promesse non tenue, une dette oubliée, une vérité à dire."},
   {p:["Le psaume 127, attribué à Salomon, commence ainsi : « Si l'Éternel ne bâtit la maison, ceux qui la bâtissent travaillent en vain ; si l'Éternel ne garde la ville, celui qui la garde veille en vain. »","Salomon avait bâti le Temple et son palais. Il savait que les murs ne suffisent pas. Une maison est vraiment protégée quand Dieu en est le gardien.","Dans cette leçon, vous allez bénir votre maison pièce par pièce. C'est une pratique simple et très ancienne : confier à Dieu chaque lieu de votre vie."],
    v:"Si l'Éternel ne bâtit la maison, ceux qui la bâtissent travaillent en vain ; si l'Éternel ne garde la ville, celui qui la garde veille en vain.",r:"Psaume 127:1",
    pr:"Éternel, je te confie ma maison. Garde sa porte et ses fenêtres. Bénis la cuisine et la table, les chambres et le sommeil, le salon et les conversations. Sois le gardien de ce lieu et de tous ceux qui y vivent. Amen.",
    g:"Faites le tour de votre maison en disant dans chaque pièce : « Seigneur, je te confie ce lieu. Que ta paix l'habite. »"},
   {p:["Dans le Cantique des cantiques, l'amour dit : « Mets-moi comme un sceau sur ton cœur. » Un sceau royal marquait ce qui appartenait au roi. Personne n'osait y toucher.","Être marqué du sceau de Dieu, c'est savoir que vous lui appartenez. Votre vie n'est pas abandonnée au hasard : elle porte la marque d'un Roi qui vous aime et qui vous garde.","Cette dernière prière scelle les trois autres. Dites-la lentement, la main posée sur votre cœur."],
    v:"Mets-moi comme un sceau sur ton cœur, comme un sceau sur ton bras ; car l'amour est fort comme la mort.",r:"Cantique des cantiques 8:6",
    pr:"Seigneur, mets ton sceau sur mon cœur. Je t'appartiens. Que ton amour, plus fort que la mort, me garde dans chaque épreuve. Scelle ma vie, ma maison et ceux que j'aime sous ta protection. Amen.",
    g:"Posez la main sur votre cœur et dites lentement : « J'appartiens au Roi. Je suis gardé. » Refaites ce geste chaque soir de la semaine."}
  ]},
 {id:'temple',t:"Les 7 Prières du Temple",img:'img/temple.jpg',hero:'img/temple-hero.jpg',badge:'Programme royal · 7 prières',
  sub:"Le jour où Salomon a consacré le Temple, il a prié pour toutes les situations de la vie.",
  quote:"Mes yeux seront ouverts, et mes oreilles attentives à la prière faite en ce lieu.",
  learn:["La grande prière de dédicace de Salomon","Une prière pour chaque épreuve","Le pardon, la provision, la guérison","Faire de votre cœur un temple"],
  l:["Le pardon qui relève","La pluie sur la terre sèche","Quand le cœur souffre","Une maison ouverte à tous","Dans le combat","Le chemin du retour","Un cœur tout entier"],
  d:["Quand on a failli, Dieu écoute encore.","La prière pour la provision quand tout est sec.","Seul Dieu connaît le cœur de chacun.","La prière qui ne laisse personne dehors.","Demander à Dieu de faire droit à notre cause.","Revenir à Dieu, même de très loin.","La bénédiction finale de Salomon."],
  tx:[
   {p:["Le Temple était achevé. Tout le peuple était rassemblé. Salomon s'agenouilla devant l'autel, les mains levées vers le ciel, et il pria une longue prière, l'une des plus belles de la Bible.","Il commence par une demande que nous connaissons tous : le pardon. « Exauce du lieu de ta demeure, des cieux, exauce et pardonne ! » Salomon savait que son peuple tomberait, et qu'il aurait besoin d'un lieu pour revenir.","Ce lieu, aujourd'hui, c'est votre prière. Quoi que vous ayez fait, la porte reste ouverte."],
    v:"Daigne écouter la supplication de ton serviteur et de ton peuple d'Israël, lorsqu'ils prieront en ce lieu ! Exauce du lieu de ta demeure, des cieux, exauce et pardonne !",r:"1 Rois 8:30",
    pr:"Éternel, j'ai failli, et tu le sais. Je viens à toi sans excuses. Exauce et pardonne. Relève-moi, purifie-moi, et donne-moi un nouveau départ. Merci parce que ta porte reste ouverte. Amen.",
    g:"Écrivez sur un papier ce que vous regrettez, présentez-le à Dieu, puis déchirez-le en disant : « Je suis pardonné. »"},
   {p:["Salomon prie ensuite pour les temps de sécheresse : quand le ciel est fermé, qu'il ne pleut plus, et que la terre ne donne plus rien.","Dans nos vies aussi, il y a des saisons sèches : manque d'argent, de travail, de joie ou d'idées. Salomon demande à Dieu de faire venir la pluie sur la terre qu'il a donnée en héritage.","Cette prière est pour vos zones sèches. Nommez-les une à une, et demandez la pluie."],
    v:"Exauce-les des cieux, pardonne le péché de tes serviteurs et de ton peuple d'Israël, à qui tu enseigneras la bonne voie dans laquelle ils doivent marcher, et fais venir la pluie sur la terre que tu as donnée en héritage à ton peuple !",r:"1 Rois 8:36",
    pr:"Seigneur, tu vois les zones sèches de ma vie. Je te les présente : mes finances, mon travail, mon cœur. Fais venir la pluie. Que ce qui était stérile redevienne fécond, et que ta provision coule à nouveau. Amen.",
    g:"Arrosez aujourd'hui une plante en priant pour une zone sèche de votre vie. Regardez-la grandir dans les semaines qui viennent."},
   {p:["Puis Salomon pense à toutes les souffrances possibles : la maladie, le fléau, l'angoisse. Il ne dresse pas une liste froide ; il dit à Dieu : chacun connaît la plaie de son propre cœur.","Et il ajoute une phrase qui console profondément : « Car seul tu connais le cœur de tous les enfants des hommes. » Personne d'autre ne sait vraiment ce que vous portez. Dieu, lui, le sait.","Dans cette prière, vous n'avez pas besoin de bien expliquer. Il connaît déjà votre cœur."],
    v:"Exauce-le des cieux, du lieu de ta demeure, et pardonne ; agis, et rends à chacun selon ses voies, puisque tu connais son cœur, car seul tu connais le cœur de tous les enfants des hommes.",r:"1 Rois 8:39",
    pr:"Éternel, tu connais la plaie de mon cœur mieux que moi. Je n'ai pas besoin de tout t'expliquer. Viens guérir ce qui souffre en moi, dans mon corps et dans mon âme. Agis selon ta bonté. Amen.",
    g:"Restez trois minutes en silence, la main sur la poitrine, et laissez Dieu regarder votre cœur sans rien dire."},
   {p:["Salomon a une pensée étonnante pour son époque : il prie aussi pour l'étranger, celui qui ne fait pas partie du peuple, mais qui viendra de loin pour prier.","Le Temple n'était pas réservé à quelques-uns. Dieu voulait que tous puissent s'approcher. Cette prière nous rappelle que personne n'est trop loin, trop différent ou trop indigne pour être écouté.","Si vous vous êtes souvent senti à l'écart, cette prière est pour vous. Et si vous connaissez quelqu'un qui se sent exclu, priez pour lui aujourd'hui."],
    v:"Exauce-le des cieux, du lieu de ta demeure, et accorde à cet étranger tout ce qu'il te demandera.",r:"1 Rois 8:43",
    pr:"Seigneur, merci parce que ta maison est ouverte à tous. Même quand je me sens loin, tu m'accueilles. Je te confie aussi ceux qui se sentent exclus. Accorde-leur ce qu'ils te demandent, et fais-leur sentir ton amour. Amen.",
    g:"Faites aujourd'hui un geste d'accueil envers une personne isolée : un mot, un appel, une invitation."},
   {p:["Salomon prie pour les temps de combat : quand le peuple doit affronter l'adversité, il demande que Dieu écoute et fasse droit à sa cause.","Nous avons tous des combats : un procès, un conflit familial, une maladie, une injustice. Salomon ne demande pas la vengeance ; il demande que Dieu rende justice.","Confier son combat à Dieu, c'est arrêter de le porter seul. Ce n'est pas abandonner : c'est se battre avec le Roi à ses côtés."],
    v:"Exauce des cieux leurs prières et leurs supplications, et fais-leur droit.",r:"1 Rois 8:45",
    pr:"Éternel, je te présente le combat que je mène. Tu vois l'injustice et la fatigue. Je ne veux pas me venger ; je te demande de faire droit à ma cause. Combats pour moi, et donne-moi la paix pendant la bataille. Amen.",
    g:"Nommez votre combat à voix haute, puis dites : « Seigneur, ce combat est maintenant le tien. » Répétez-le chaque fois que l'inquiétude revient."},
   {p:["Salomon prévoit même le pire : que son peuple s'éloigne tellement qu'il se retrouve en exil, loin de tout. Et même là, il prie : s'ils rentrent en eux-mêmes et reviennent à toi de tout leur cœur, exauce-les.","Il n'y a pas de distance que Dieu ne puisse franchir. Pas de chemin trop long pour revenir. Ce qui compte, c'est le premier pas du retour.","Cette prière est pour vous si vous vous sentez loin de Dieu, ou pour quelqu'un que vous aimez et qui s'est éloigné."],
    v:"S'ils reviennent à toi de tout leur cœur et de toute leur âme, exauce des cieux, du lieu de ta demeure, leurs prières et leurs supplications.",r:"1 Rois 8:48-49",
    pr:"Seigneur, je reviens vers toi, même de loin. Ou je te confie celui que j'aime et qui s'est éloigné. Ouvre le chemin du retour. Que nos cœurs se tournent vers toi tout entiers, et que tu nous accueilles comme le père accueille ses enfants. Amen.",
    g:"Écrivez le prénom d'une personne qui s'est éloignée de Dieu ou de vous, et priez pour elle chaque jour cette semaine."},
   {p:["Après sa longue prière, Salomon se relève et bénit le peuple. Il termine par un souhait : « Que votre cœur soit tout entier à l'Éternel, notre Dieu. »","Un cœur tout entier, c'est un cœur qui n'est pas partagé entre la peur et la foi, entre Dieu et les idoles du moment. C'est un cœur unifié, apaisé, tourné dans une seule direction.","Vous avez prié les sept prières du Temple. Faites maintenant de votre cœur ce temple : un lieu où Dieu habite, où l'on peut revenir, où la prière est toujours entendue."],
    v:"Que votre cœur soit tout à l'Éternel, notre Dieu, comme il l'est aujourd'hui, pour suivre ses lois et pour observer ses commandements.",r:"1 Rois 8:61",
    pr:"Éternel, je te consacre mon cœur comme Salomon t'a consacré le Temple. Que tu y habites, que ta paix le remplisse, et qu'il soit tout entier à toi. Que ma vie soit une maison de prière. Amen.",
    g:"Choisissez un petit coin de votre maison pour la prière : une chaise, une bougie, une Bible. Ce sera votre « temple » de la semaine."}
  ]},
 {id:'cantique',t:"Le Cantique de l'Amour Fidèle",img:'img/cantique.jpg',hero:'img/cantique-hero.jpg',badge:'Programme royal · 4 leçons',
  sub:"Les prières tirées du Cantique de Salomon pour votre couple, votre famille et l'amour que vous attendez.",
  quote:"Les grandes eaux ne peuvent éteindre l'amour.",
  learn:["Bénir votre couple ou l'amour à venir","Protéger l'amour des petites usures","Retrouver la tendresse","Un amour plus fort que les tempêtes"],
  l:["L'hiver est passé","Les petits renards","Je suis à lui, il est à moi","Plus fort que les grandes eaux"],
  d:["Quand l'amour retrouve son printemps.","Ce qui abîme l'amour sans faire de bruit.","La prière de l'appartenance et de la tendresse.","Sceller l'amour sous la protection de Dieu."],
  tx:[
   {p:["Le Cantique des cantiques est le plus beau poème d'amour de la Bible, attribué à Salomon. Il commence comme un printemps : « L'hiver est passé ; la pluie a cessé. Les fleurs paraissent sur la terre. »","Dans beaucoup de vies, l'amour a traversé un hiver : silence, distance, blessures, deuil ou solitude. Ce cantique annonce que l'hiver ne dure pas toujours.","Que vous soyez en couple, seul ou en deuil, cette prière demande à Dieu de faire revenir le printemps dans votre cœur."],
    v:"Car voici, l'hiver est passé ; la pluie a cessé, elle s'en est allée. Les fleurs paraissent sur la terre.",r:"Cantique des cantiques 2:11-12",
    pr:"Seigneur, l'hiver a été long dans mon cœur. Je te demande le printemps : que la tendresse refleurisse, que les silences se brisent, que la joie revienne. Fais paraître des fleurs là où il n'y avait que du froid. Amen.",
    g:"Offrez aujourd'hui une fleur, un mot tendre ou un geste d'attention à quelqu'un que vous aimez."},
   {p:["Le Cantique dit : « Prenez-nous les renards, les petits renards qui ravagent les vignes. » Ce ne sont pas les grands loups qui détruisent la vigne, mais les petits renards, discrets et réguliers.","Dans l'amour, ce sont souvent les petites choses qui abîment : un reproche répété, un merci oublié, un écran entre deux regards, une rancune gardée.","Cette leçon vous invite à repérer vos petits renards, et à demander à Dieu de les chasser."],
    v:"Prenez-nous les renards, les petits renards qui ravagent les vignes ; car nos vignes sont en fleur.",r:"Cantique des cantiques 2:15",
    pr:"Éternel, montre-moi les petits renards qui abîment mon amour : mes paroles sèches, mes oublis, mes impatiences. Aide-moi à les chasser. Protège notre vigne, car elle est en fleur. Amen.",
    g:"Identifiez un « petit renard » dans votre relation (ou dans votre façon d'aimer) et faites l'effort inverse aujourd'hui."},
   {p:["« Mon bien-aimé est à moi, et je suis à lui. » C'est une parole d'appartenance, de confiance et de tendresse.","L'amour véritable n'est pas une possession, c'est un don mutuel. Chacun se donne et reçoit l'autre. Cette parole est aussi une image de l'amour de Dieu pour vous : il est à vous, et vous êtes à lui.","Cette prière renouvelle les liens : dans votre couple, ou dans votre relation avec Dieu si vous êtes seul."],
    v:"Mon bien-aimé est à moi, et je suis à lui.",r:"Cantique des cantiques 2:16",
    pr:"Seigneur, merci pour l'amour que tu m'as donné. Renouvelle nos liens. Que nous nous donnions l'un à l'autre avec tendresse et fidélité. Et rappelle-moi que, quoi qu'il arrive, je suis à toi et tu es à moi. Amen.",
    g:"Dites aujourd'hui à la personne que vous aimez une phrase simple : « Je suis heureux que tu sois dans ma vie. »"},
   {p:["Le Cantique s'achève sur une promesse : « Les grandes eaux ne peuvent éteindre l'amour, et les fleuves ne le submergeraient pas. »","Les grandes eaux, ce sont les épreuves : maladie, problèmes d'argent, conflits, années qui passent. Un amour confié à Dieu traverse ces eaux sans s'éteindre.","Dans cette dernière prière, vous allez sceller votre amour, ou l'amour que vous attendez, sous la protection de Dieu."],
    v:"Les grandes eaux ne peuvent éteindre l'amour, et les fleuves ne le submergeraient pas.",r:"Cantique des cantiques 8:7",
    pr:"Éternel, je scelle mon amour sous ta protection. Que les grandes eaux ne l'éteignent pas, que les épreuves le rendent plus fort, et que les années le rendent plus doux. Bénis notre foyer pour toujours. Amen.",
    g:"Si vous êtes en couple, priez ensemble cette prière ce soir en vous tenant la main. Sinon, priez-la pour l'amour que Dieu vous prépare."}
  ]},
 {id:'temps',t:"Un Temps pour Chaque Chose",img:'img/temps.jpg',hero:'img/temps-hero.jpg',badge:'Programme royal · 4 leçons',
  sub:"La sagesse de l'Ecclésiaste pour traverser chaque saison de la vie avec paix.",
  quote:"Il fait toute chose belle en son temps.",
  learn:["Accepter la saison que vous vivez","Ne plus marcher seul","Semer sans avoir peur","Revenir à l'essentiel"],
  l:["Un temps pour tout","Deux valent mieux qu'un","Jette ton pain sur les eaux","La fin du discours"],
  d:["La paix de celui qui comprend les saisons.","La force des liens et de l'entraide.","La foi de celui qui sème sans voir.","Ce que Salomon a retenu après avoir tout vécu."],
  tx:[
   {p:["À la fin de sa vie, Salomon a écrit l'Ecclésiaste, le livre d'un homme qui a tout vu, tout essayé, tout possédé. Et il a écrit : « Il y a un temps pour tout. »","Un temps pour naître et un temps pour mourir, un temps pour planter et un temps pour arracher, un temps pour pleurer et un temps pour rire. Aucune saison n'est éternelle.","Cette leçon vous aide à reconnaître la saison que vous vivez, à l'accepter sans désespoir, et à attendre la suivante avec confiance."],
    v:"Il y a un temps pour tout, un temps pour toute chose sous les cieux.",r:"Ecclésiaste 3:1",
    pr:"Seigneur, je ne comprends pas toujours la saison que je traverse. Aide-moi à l'accepter et à y trouver ce qu'elle peut m'apprendre. Je crois que tu fais toute chose belle en son temps. Amen.",
    g:"Écrivez en une phrase la saison que vous vivez (« un temps pour… »), puis écrivez celle que vous espérez."},
   {p:["Salomon observe : « Deux valent mieux qu'un. Car, s'ils tombent, l'un relève son compagnon. Mais malheur à celui qui est seul et qui tombe. »","Nous n'avons pas été créés pour marcher seuls. La solitude rend les épreuves plus lourdes ; l'amitié et la fraternité les rendent supportables.","Et il ajoute : « La corde à trois fils ne se rompt pas facilement. » Quand Dieu est le troisième fil d'une relation, elle devient très solide."],
    v:"Deux valent mieux qu'un, parce qu'ils retirent un bon salaire de leur travail. Car, s'ils tombent, l'un relève son compagnon.",r:"Ecclésiaste 4:9-10",
    pr:"Éternel, merci pour ceux qui marchent avec moi. Si je suis seul, envoie-moi des compagnons de route. Et fais de moi un soutien pour quelqu'un d'autre. Sois le troisième fil de mes liens. Amen.",
    g:"Appelez aujourd'hui une personne qui vit peut-être seule, juste pour prendre de ses nouvelles."},
   {p:["« Jette ton pain sur la face des eaux, car avec le temps tu le retrouveras. » Cette image étonnante parle de semer sans calculer.","Le bien que nous faisons s'en va parfois au fil de l'eau, et nous ne voyons pas de résultat. Mais Salomon promet qu'avec le temps, il revient.","Cette leçon vous libère de la peur de donner pour rien. Semez avec foi : rien de ce qui est fait avec amour n'est perdu."],
    v:"Jette ton pain sur la face des eaux, car avec le temps tu le retrouveras.",r:"Ecclésiaste 11:1",
    pr:"Seigneur, apprends-moi à semer sans compter. Que je fasse le bien même quand je ne vois pas de résultat. Je crois qu'avec le temps, tu feras revenir chaque semence d'amour. Amen.",
    g:"Faites aujourd'hui une bonne action dont vous ne verrez probablement jamais le résultat."},
   {p:["Après avoir tout essayé, la sagesse, le plaisir, le travail, la richesse, Salomon conclut l'Ecclésiaste par une phrase simple : « Crains Dieu et observe ses commandements. C'est là ce que doit faire tout homme. »","C'est le testament du roi le plus sage et le plus riche de son temps. Au bout du chemin, tout se résume à une relation vivante avec Dieu.","Cette dernière leçon vous invite à simplifier : enlever ce qui encombre, garder ce qui compte, et marcher avec Dieu chaque jour."],
    v:"Écoutons la fin du discours : Crains Dieu et observe ses commandements. C'est là ce que doit faire tout homme.",r:"Ecclésiaste 12:13",
    pr:"Éternel, après tout ce que j'ai cherché, je reviens à l'essentiel : toi. Simplifie ma vie, enlève ce qui m'encombre, et garde-moi près de toi chaque jour. Amen.",
    g:"Choisissez une chose inutile qui encombre votre vie (un objet, une habitude, une inquiétude) et laissez-la partir aujourd'hui."}
  ]}
];
