const THEME_PAGE={sub:{},intro:{},learn:{},hero:{},dur:{},vid:{},eps:{}}; // contenu des thèmes mensuels : à ajouter quand les leçons seront prêtes
const DAILY=[["Pour la sagesse : un cœur qui écoute","Demandez ce que Salomon a demandé avant tout le reste.","Seigneur, comme le jeune roi à Gabaon, je ne sais pas toujours comment marcher. Donne-moi un cœur qui écoute, qui discerne le bien du mal, et qui reste humble devant toi. Je ne te demande pas d'abord des richesses, mais ta lumière pour chaque décision. Amen.","Accorde donc à ton serviteur un cœur intelligent pour juger ton peuple, pour discerner le bien du mal !","1 Rois 3:9","Salomon aurait pu demander l'or ou la victoire. Il a demandé un cœur qui écoute, et tout le reste lui a été donné par surcroît."],["Pour vos finances : la bénédiction qui enrichit","Confiez à Dieu votre argent, vos dettes et vos projets.","Éternel, tout ce que je possède vient de toi. Bénis le travail de mes mains, ouvre les portes qui doivent s'ouvrir et ferme celles qui me feraient du tort. Que ma prospérité ne m'apporte aucun chagrin, mais la paix et la possibilité de bénir les autres. Amen.","C'est la bénédiction de l'Éternel qui enrichit, et il ne la fait suivre d'aucun chagrin.","Proverbes 10:22","Le roi le plus riche de son temps savait d'où venait sa richesse. Une abondance qui vient de Dieu n'ajoute pas d'inquiétude."],["Pour la protection : la tour forte","Réfugiez-vous dans le Nom qui protège.","Seigneur, ton Nom est ma tour forte. Ce matin, j'y entre avec ma famille, ma maison et tout ce qui m'inquiète. Que rien de mauvais ne franchisse cette porte. Garde mes pas, mes paroles et mon sommeil sous ta protection. Amen.","Le nom de l'Éternel est une tour forte ; le juste s'y réfugie, et se trouve en sûreté.","Proverbes 18:10","Une tour n'empêche pas l'orage d'exister ; elle empêche l'orage de vous atteindre. Prononcez son Nom avec confiance aujourd'hui."],["Pour votre famille : bâtir la maison","Remettez votre foyer entre les mains du vrai bâtisseur.","Éternel, si tu ne bâtis pas ma maison, je travaille en vain. Viens poser toi-même les fondations de mon foyer. Mets la douceur dans nos paroles, la patience dans nos gestes et la paix à notre table. Que chacun ici se sache aimé. Amen.","Si l'Éternel ne bâtit la maison, ceux qui la bâtissent travaillent en vain.","Psaume 127:1","Ce psaume est attribué à Salomon, le bâtisseur du Temple. Il savait que les plus beaux murs ne suffisent pas sans la présence de Dieu."],["Pour votre santé : le remède du cœur joyeux","Demandez la guérison du corps et la joie qui restaure.","Seigneur, je te présente mon corps fatigué et ce qui me fait souffrir. Guéris ce qui doit être guéri, apaise ce qui est tendu, et accompagne ceux qui me soignent. Rends-moi aussi la joie, car tu sais qu'un cœur joyeux est déjà un remède. Amen.","Un cœur joyeux est un bon remède, mais un esprit abattu dessèche les os.","Proverbes 17:22","Salomon avait observé ce que la médecine confirme : la paix intérieure aide le corps à se relever. Cherchez aujourd'hui une raison de sourire."],["Pour une décision : la confiance totale","Avant de choisir, remettez le choix à Dieu.","Éternel, je dois prendre une décision et je ne vois pas tout le chemin. Je ne veux pas m'appuyer seulement sur mon intelligence. Je te reconnais dans cette situation : aplanis mon sentier, montre-moi le pas juste, et donne-moi la paix quand j'aurai choisi. Amen.","Confie-toi en l'Éternel de tout ton cœur, et ne t'appuie pas sur ta sagesse ; reconnais-le dans toutes tes voies, et il aplanira tes sentiers.","Proverbes 3:5-6","Le plus sage des rois écrivait : ne t'appuie pas sur ta sagesse. La vraie sagesse commence par reconnaître ses limites."],["Pour vos paroles : la langue qui donne la vie","Demandez des mots qui guérissent au lieu de blesser.","Seigneur, garde ma bouche aujourd'hui. Que mes paroles construisent au lieu de détruire, consolent au lieu d'accuser, bénissent au lieu de maudire. Et sur ma propre vie, que je prononce ta promesse plutôt que mes peurs. Amen.","La mort et la vie sont au pouvoir de la langue ; quiconque l'aime en mangera les fruits.","Proverbes 18:21","Ce que vous dites de votre vie finit par la façonner. Aujourd'hui, prononcez une bénédiction sur vous-même et sur un proche."],["Pour votre travail : la main diligente","Confiez votre travail et vos efforts à Dieu.","Éternel, bénis le travail que tu m'as confié. Donne-moi la constance quand c'est difficile, l'honnêteté quand c'est tentant de tricher, et la joie dans les tâches ordinaires. Que mon effort porte du fruit, pour moi et pour ceux que j'aime. Amen.","Celui qui agit d'une main lâche s'appauvrit, mais la main des diligents enrichit.","Proverbes 10:4","Salomon ne promet pas la richesse aux rêveurs, mais à ceux qui avancent un peu chaque jour. Faites aujourd'hui une petite chose avec soin."],["Pour la paix : un sommeil doux","Déposez vos inquiétudes avant la nuit.","Seigneur, ce soir je pose devant toi tout ce qui tourne dans ma tête. Je ne peux pas tout régler, mais toi tu veilles. Donne-moi un sommeil profond et paisible, et réveille-moi demain avec une force nouvelle. Amen.","Si tu te couches, tu seras sans crainte ; et quand tu seras couché, ton sommeil sera doux.","Proverbes 3:24","Celui qui marche avec la sagesse n'emporte pas ses fardeaux dans son lit. Confiez-les à Dieu, il ne dort pas."],["Pour un nouveau départ : l'hiver est passé","Accueillez la saison nouvelle que Dieu prépare.","Éternel, l'hiver a été long dans ma vie. Je te remercie d'être resté avec moi dans le froid. Aujourd'hui, je te demande de faire fleurir ce qui semblait mort, de réchauffer ce qui s'était refroidi, et de m'ouvrir une saison nouvelle. Amen.","Car voici, l'hiver est passé ; la pluie a cessé, elle s'en est allée. Les fleurs paraissent sur la terre.","Cantique des cantiques 2:11-12","Dans le Cantique de Salomon, le printemps arrive toujours. Ce que vous traversez n'est pas la fin de l'histoire."],["Pour le pardon : l'amour qui couvre","Demandez la force de pardonner et d'être pardonné.","Seigneur, il y a une blessure que je garde depuis trop longtemps. Je ne veux plus que la rancune décide à ma place. Aide-moi à pardonner, même si cela prend du temps, et pardonne-moi aussi mes propres fautes. Que l'amour couvre ce que la colère voulait exposer. Amen.","La haine excite des querelles, mais l'amour couvre toutes les fautes.","Proverbes 10:12","Pardonner ne veut pas dire oublier. Cela veut dire ne plus laisser l'offense gouverner votre cœur."],["Pour les enfants : la bonne voie","Confiez vos enfants et petits-enfants à Dieu.","Père, je te confie mes enfants et ceux que j'aime comme mes enfants. Guide leurs pas, protège-les des mauvaises influences, et ramène-les à toi s'ils s'en sont éloignés. Que ce que nous avons semé en eux porte du fruit, même tard. Amen.","Instruis l'enfant selon la voie qu'il doit suivre ; et quand il sera vieux, il ne s'en détournera pas.","Proverbes 22:6","Ce qui est semé avec amour n'est jamais perdu. Il peut dormir longtemps avant de germer."],["Pour la gratitude : compter les bienfaits","Ouvrez la journée en remerciant.","Éternel, avant de te demander quoi que ce soit, je veux te dire merci. Merci pour le souffle de ce matin, pour le toit sur ma tête, pour les visages que j'aime. Ouvre mes yeux sur les bénédictions que je ne remarque plus. Amen.","Béni soit l'Éternel, qui a donné du repos à son peuple d'Israël, selon toutes ses promesses !","1 Rois 8:56","Lors de la dédicace du Temple, Salomon a commencé par bénir Dieu. Remercier ouvre la porte à toutes les autres prières."],["Contre l'inquiétude : la bonne parole","Laissez une parole de Dieu chasser l'angoisse.","Seigneur, l'inquiétude pèse sur mon cœur et m'abat. Je te demande une bonne parole aujourd'hui : un verset, un appel, un signe de ta présence. Remplace mon angoisse par ta paix, et ma peur par la confiance. Amen.","L'inquiétude dans le cœur de l'homme l'abat, mais une bonne parole le réjouit.","Proverbes 12:25","Une seule parole juste peut relever un cœur abattu. Cherchez-la aujourd'hui, et soyez-la pour quelqu'un d'autre."],["Pour vos projets : les remettre à Dieu","Placez vos projets entre ses mains avant de commencer.","Éternel, je te recommande ce projet qui me tient à cœur. Tu connais mes intentions, mes forces et mes manques. Si ce chemin est bon, fais-le réussir ; s'il ne l'est pas, montre-moi le meilleur. Je veux avancer avec toi. Amen.","Recommande à l'Éternel tes œuvres, et tes projets réussiront.","Proverbes 16:3","Recommander, c'est confier quelque chose de précieux à quelqu'un de sûr. Salomon a bâti le Temple ainsi : en confiant chaque pierre à Dieu."],["Pour le couple : l'amour plus fort","Bénissez votre amour ou demandez sa restauration.","Seigneur, je te présente mon couple, ou l'amour que j'attends. Garde ce lien comme un sceau sur notre cœur. Que les grandes eaux des difficultés ne l'éteignent pas, et que la tendresse revienne là où elle s'était perdue. Amen.","Les grandes eaux ne peuvent éteindre l'amour, et les fleuves ne le submergeraient pas.","Cantique des cantiques 8:7","Le Cantique de Salomon célèbre un amour qui résiste au temps. Un amour confié à Dieu devient plus fort que les tempêtes."],["Pour la générosité : celui qui arrose","Ouvrez votre main, et laissez Dieu remplir la vôtre.","Éternel, apprends-moi à donner sans crainte de manquer. Montre-moi aujourd'hui une personne que je peux aider, même un peu. Et je crois que tu prendras soin de moi, car celui qui arrose sera lui-même arrosé. Amen.","L'âme bienfaisante sera rassasiée, et celui qui arrose sera lui-même arrosé.","Proverbes 11:25","Dans le royaume de Dieu, la main qui donne ne se vide pas. Un petit geste généreux aujourd'hui sème une moisson."],["Pour la patience : chaque chose en son temps","Acceptez le rythme de Dieu pour ce que vous attendez.","Seigneur, j'attends depuis longtemps et je suis fatigué d'attendre. Apprends-moi que tu fais toute chose belle en son temps. Garde mon cœur de l'amertume, et prépare-moi à recevoir ce que tu prépares pour moi. Amen.","Il fait toute chose bonne en son temps ; même il a mis dans leur cœur la pensée de l'éternité.","Ecclésiaste 3:11","Le sage de l'Ecclésiaste avait tout vu. Sa conclusion : rien n'est en retard dans le calendrier de Dieu."],["Pour la protection de la maison","Placez votre foyer sous la garde de Dieu.","Éternel, je bénis ma maison en ton Nom. Garde ses portes et ses fenêtres, ceux qui y dorment et ceux qui y entrent. Que ta paix habite chaque pièce, et que rien de ce qui vient du mal n'y trouve sa place. Amen.","Celui qui craint l'Éternel possède un appui ferme, et ses enfants ont un refuge auprès de lui.","Proverbes 14:26","Une maison confiée à Dieu devient un refuge, non seulement pour vous, mais aussi pour vos enfants."],["Pour garder son cœur","Protégez la source de toute votre vie.","Seigneur, garde mon cœur aujourd'hui. Protège-le de l'amertume, de la jalousie, du découragement et des pensées qui empoisonnent. Remplis-le de ce qui est pur et bon, car c'est de lui que coule toute ma vie. Amen.","Garde ton cœur plus que toute autre chose, car de lui viennent les sources de la vie.","Proverbes 4:23","Salomon place le cœur avant les biens, avant la maison et avant la réputation. Tout le reste en découle."],["Pour la colère : maître de soi","Demandez la douceur quand tout s'agite.","Seigneur, quand la colère monte en moi, pose ta main sur mon cœur. Aide-moi à respirer avant de répondre, à choisir la douceur plutôt que la blessure. Je veux être maître de moi-même, avec ta force. Amen.","Celui qui est lent à la colère vaut mieux qu'un héros, et celui qui est maître de lui-même, que celui qui prend des villes.","Proverbes 16:32","Pour Salomon, la plus grande victoire n'est pas militaire. C'est celle que l'on remporte sur soi-même."],["Pour un ami : l'amitié fidèle","Priez pour un ami, ou demandez une amitié vraie.","Éternel, merci pour les amis que tu as mis sur ma route. Bénis aujourd'hui celui ou celle à qui je pense. Et si je me sens seul, envoie-moi une amitié fidèle, qui reste dans le malheur comme dans la joie. Amen.","L'ami aime en tout temps, et dans le malheur il se montre un frère.","Proverbes 17:17","Un véritable ami est un cadeau de Dieu. Envoyez aujourd'hui un message à quelqu'un qui compte pour vous."],["Pour se relever après une chute","Recommencez, même après être tombé.","Seigneur, je suis tombé encore une fois. Je ne veux pas rester à terre. Relève-moi par ta grâce, efface ma honte et rends-moi le courage d'avancer. Je crois que ma chute n'est pas la fin de mon chemin. Amen.","Car sept fois le juste tombe, et il se relève.","Proverbes 24:16","Le juste n'est pas celui qui ne tombe jamais : c'est celui qui se relève, encore et encore."],["Pour la vérité : avouer et être libéré","Déposez devant Dieu ce que vous cachez.","Éternel, il y a des choses que je cache, même à moi-même. Je te les apporte aujourd'hui. Je ne veux plus porter ce poids en silence. Pardonne-moi, purifie-moi et aide-moi à changer de chemin. Amen.","Celui qui cache ses transgressions ne prospère point, mais celui qui les avoue et les délaisse obtient miséricorde.","Proverbes 28:13","Le secret qui ronge empêche la paix de grandir. La miséricorde de Dieu attend seulement une parole sincère."],["Pour l'espérance : votre avenir","Croyez que Dieu a encore un avenir pour vous.","Seigneur, il m'arrive de penser que tout est derrière moi. Rappelle-moi aujourd'hui qu'il y a un avenir et que mon espérance ne sera pas déçue. Ouvre devant moi un chemin que je n'imaginais pas. Amen.","Car il est un avenir, et ton espérance ne sera pas anéantie.","Proverbes 23:18","Quel que soit votre âge, Dieu ne vous a pas mis de côté. Le meilleur peut encore venir."],["Pour les pauvres : prêter à Dieu","Priez pour ceux qui manquent et ouvrez votre cœur.","Éternel, je te confie ceux qui ont faim, froid ou peur aujourd'hui. Pourvois à leurs besoins, et montre-moi comment je peux aider. Ce que je donne au petit, je le prête à toi, et je sais que tu es fidèle. Amen.","Celui qui a pitié du pauvre prête à l'Éternel, qui lui rendra selon son œuvre.","Proverbes 19:17","Salomon fait de Dieu le garant de chaque geste de bonté. Rien de ce qui est donné par amour n'est perdu."],["Pour honorer Dieu de ses biens","Offrez à Dieu la première place dans vos finances.","Seigneur, je veux t'honorer avec ce que j'ai, même si c'est peu. Que la première part de mon temps, de mon argent et de mon attention soit pour toi. Je crois que tu sais remplir les greniers de ceux qui te font confiance. Amen.","Honore l'Éternel avec tes biens, et avec les prémices de tout ton revenu : alors tes greniers seront remplis d'abondance, et tes cuves regorgeront de moût.","Proverbes 3:9-10","C'est l'un des secrets de la prospérité de Salomon : Dieu d'abord, le reste ensuite."],["Pour la croissance patiente","Bâtissez votre abondance pas à pas.","Éternel, garde-moi des promesses de richesse facile. Apprends-moi à construire peu à peu, avec honnêteté et régularité. Bénis les petits pas que je fais chaque jour, et fais grandir ce que je bâtis avec toi. Amen.","La richesse mal acquise diminue, mais celui qui amasse peu à peu l'augmente.","Proverbes 13:11","Le roi le plus riche du monde conseille la patience. Ce qui grandit lentement grandit solidement."],["Pour sortir des dettes","Remettez à Dieu ce qui vous lie.","Seigneur, les dettes pèsent sur moi comme des chaînes. Donne-moi la sagesse pour m'organiser, le courage pour en parler, et ouvre-moi des solutions que je ne vois pas encore. Délivre-moi de ce qui m'enferme, pas à pas. Amen.","Le riche domine sur les pauvres, et celui qui emprunte est l'esclave de celui qui prête.","Proverbes 22:7","Salomon appelle les choses par leur nom. Le premier pas vers la liberté est de regarder sa situation en face, avec Dieu."],["Pour la réputation : un nom honorable","Demandez de vivre de façon que votre nom soit béni.","Éternel, je veux vivre de façon droite, même quand personne ne regarde. Que mon nom soit synonyme de confiance pour ceux qui me connaissent. Garde-moi du mensonge et de la ruse, et donne-moi ta grâce devant les autres. Amen.","La réputation est préférable à de grandes richesses, et la grâce vaut mieux que l'argent et que l'or.","Proverbes 22:1","Un bon nom se construit en mille petits choix honnêtes. C'est un héritage plus précieux que l'or."],["Pour la paix du cœur : la vie du corps","Laissez Dieu calmer ce qui s'agite en vous.","Seigneur, mon cœur est agité, et je sens que mon corps en souffre. Je te donne mes comparaisons, mes envies et mes frustrations. Remplace-les par ton calme, pour que mon cœur apaisé redevienne une source de vie. Amen.","Un cœur calme est la vie du corps, mais l'envie est la carie des os.","Proverbes 14:30","Salomon avait compris le lien entre l'âme et le corps. Un cœur en paix nourrit tout l'être."],["Pour les conseils justes","Demandez à Dieu de bons conseillers.","Éternel, je ne veux pas décider seul. Place près de moi des personnes sages, honnêtes et bienveillantes. Donne-moi l'humilité d'écouter et le discernement pour reconnaître le bon conseil. Amen.","Les projets échouent, faute d'une assemblée qui délibère ; mais ils réussissent quand il y a de nombreux conseillers.","Proverbes 15:22","Même Salomon s'entourait de conseillers. Demander de l'aide n'est pas une faiblesse, c'est de la sagesse."],["Pour des paroles douces","Que vos mots soient comme du miel.","Seigneur, mets sur mes lèvres des paroles agréables, qui encouragent et qui guérissent. Aujourd'hui, je veux dire à quelqu'un une parole qui lui fera du bien. Que ma voix soit un instrument de ta bonté. Amen.","Les paroles agréables sont un rayon de miel, douces pour l'âme et salutaires pour le corps.","Proverbes 16:24","Une seule parole aimable peut changer la journée de quelqu'un. Offrez-en une aujourd'hui."],["Pour la réponse douce","Désarmez la colère par la douceur.","Éternel, quand on me parle durement, aide-moi à ne pas répondre de la même manière. Donne-moi une réponse douce qui calme au lieu d'enflammer. Fais de moi un artisan de paix dans ma famille et autour de moi. Amen.","Une réponse douce calme la fureur, mais une parole dure excite la colère.","Proverbes 15:1","La douceur n'est pas de la faiblesse : c'est une force qui éteint les incendies."],["Pour le plan de Dieu","Acceptez que son dessein soit meilleur que le vôtre.","Seigneur, j'ai beaucoup de projets dans le cœur. Je te les présente tous, mais je veux surtout que ton dessein s'accomplisse. Si tu fermes une porte, aide-moi à faire confiance. Si tu en ouvres une, donne-moi le courage d'entrer. Amen.","Il y a dans le cœur de l'homme beaucoup de projets, mais c'est le dessein de l'Éternel qui s'accomplit.","Proverbes 19:21","Ce que Dieu prépare dépasse souvent ce que nous avions prévu. Laissez-lui le dernier mot."],["Pour la bonté et la fidélité","Écrivez la bonté sur votre cœur.","Éternel, que la bonté et la fidélité ne m'abandonnent jamais. Grave-les sur mon cœur, pour que mes choix de chaque jour en portent la marque. Rends-moi fidèle dans les petites choses comme dans les grandes. Amen.","Que la bonté et la fidélité ne t'abandonnent pas ; lie-les à ton cou, écris-les sur la table de ton cœur.","Proverbes 3:3","Salomon conseille de porter ces deux vertus comme un collier : visibles, précieuses, toujours avec soi."],["Pour la lumière sur le chemin","Demandez que votre route devienne de plus en plus claire.","Seigneur, mon chemin me paraît encore dans la pénombre. Je crois que ta lumière grandit sur la route de ceux qui te suivent. Éclaire mon prochain pas, puis le suivant, jusqu'à ce que tout soit clair. Amen.","Le sentier des justes est comme la lumière resplendissante, dont l'éclat va croissant jusqu'au milieu du jour.","Proverbes 4:18","La lumière de l'aube ne montre pas tout d'un coup. Elle grandit, et elle suffit toujours pour le pas d'aujourd'hui."],["Pour la joie sur le visage","Demandez une joie qui se voit.","Éternel, mon visage porte la fatigue de mon cœur. Viens réjouir mon intérieur, pour que la joie se voie à l'extérieur. Que ceux que je croise aujourd'hui reçoivent un peu de ta lumière à travers moi. Amen.","Un cœur joyeux rend le visage serein ; mais quand le cœur est triste, l'esprit est abattu.","Proverbes 15:13","La joie que Dieu donne ne dépend pas des circonstances. Elle part du cœur et finit par éclairer le visage."],["Pour se contenter de ce que l'on a","Choisissez la paix plutôt que l'excès.","Seigneur, apprends-moi à apprécier ce que j'ai. Je préfère peu avec ta paix qu'un trésor avec le trouble. Garde-moi de l'avidité, et donne-moi un cœur reconnaissant pour chaque bénédiction. Amen.","Mieux vaut peu, avec la crainte de l'Éternel, qu'un grand trésor, avec le trouble.","Proverbes 15:16","Le roi qui possédait tout a écrit cette phrase. Il savait que la paix vaut plus que la fortune."],["Pour l'amour à la maison","Que l'amour règne à votre table.","Éternel, que l'amour règne dans ma maison plus que l'abondance. Bénis nos repas, même simples, et remplis-les de rires et de tendresse. Chasse la dispute et la froideur, et fais de notre table un lieu de communion. Amen.","Mieux vaut de l'herbe pour nourriture, là où règne l'amour, qu'un bœuf engraissé, si la haine est là.","Proverbes 15:17","Le plus beau festin ne vaut rien sans amour. Le repas le plus simple devient une fête quand on s'aime."],["Pour être exaucé","Croyez que Dieu entend votre prière.","Seigneur, parfois je doute que tu m'écoutes. Aujourd'hui, je choisis de croire que tu es attentif à ma voix. Purifie mon cœur pour que ma prière monte librement vers toi, et réponds-moi selon ta bonté. Amen.","L'Éternel s'éloigne des méchants, mais il écoute la prière des justes.","Proverbes 15:29","Dieu n'est pas loin. Il écoute ceux qui le cherchent avec un cœur sincère."],["Pour la réflexion et le bonheur","Prenez le temps de réfléchir avant d'agir.","Éternel, apprends-moi à ralentir et à réfléchir. Que je ne me précipite pas, mais que je prenne le temps de te consulter. Je veux trouver le bonheur que tu promets à ceux qui se confient en toi. Amen.","Celui qui réfléchit sur les choses trouve le bonheur, et celui qui se confie en l'Éternel est heureux.","Proverbes 16:20","La sagesse de Salomon n'est pas la vitesse, c'est la réflexion. Une minute de prière évite souvent des heures de regret."],["Pour la faveur auprès des autres","Demandez que même les adversaires deviennent favorables.","Seigneur, il y a une personne avec qui les relations sont difficiles. Je te la confie. Si mes voies te plaisent, dispose son cœur favorablement envers moi. Change ce qui doit changer en elle, et en moi. Amen.","Quand l'Éternel approuve les voies d'un homme, il dispose favorablement à son égard même ses ennemis.","Proverbes 16:7","Dieu peut changer un climat de conflit. Commencez par lui confier la relation, puis faites un pas de paix."],["Pour oublier les offenses","Choisissez la grandeur du pardon.","Éternel, je ne veux plus ruminer ce qu'on m'a fait. Donne-moi la sagesse d'être lent à la colère et la grandeur d'oublier les offenses. Libère mon cœur de ce poids, pour que je puisse avancer. Amen.","L'homme qui a de la sagesse est lent à la colère, et il met sa gloire à oublier les offenses.","Proverbes 19:11","Ne pas garder de comptes, c'est un signe de sagesse royale. Aujourd'hui, laissez tomber une vieille rancune."],["Pour le désir accompli","Confiez à Dieu ce que vous espérez depuis longtemps.","Seigneur, mon cœur est fatigué d'espérer. Tu connais ce désir que je porte depuis si longtemps. Accomplis-le si c'est ta volonté, et sinon, remplis ce vide par quelque chose de meilleur. Que ma vie devienne un arbre de vie. Amen.","Un espoir différé rend le cœur malade, mais un désir accompli est un arbre de vie.","Proverbes 13:12","Salomon connaît la douleur de l'attente. Il connaît aussi la joie de l'accomplissement. Les deux sont dans les mains de Dieu."],["Pour la force et la dignité","Demandez une force tranquille face à l'avenir.","Éternel, revêts-moi de force et de dignité. Que je regarde l'avenir sans peur, et même avec le sourire. Je sais que demain t'appartient, et que tu y seras avant moi. Amen.","Elle est revêtue de force et de gloire, et elle se rit de l'avenir.","Proverbes 31:25","La femme forte du dernier chapitre des Proverbes ne craint pas demain. Sa confiance est en Dieu."],["Pour la femme de la maison","Bénissez une mère, une épouse, une grand-mère.","Seigneur, je te remercie pour les femmes de foi de ma vie. Bénis leur force, leur sagesse et leur tendresse. Donne-leur le repos qu'elles oublient de prendre et la reconnaissance qu'elles méritent. Amen.","Ses fils se lèvent, et la disent heureuse ; son mari se lève, et lui donne des louanges.","Proverbes 31:28","Aujourd'hui, dites merci à une femme qui a compté dans votre vie, de vive voix ou dans votre prière."],["Pour bâtir avec sagesse","Demandez que votre maison soit remplie de biens précieux.","Éternel, c'est par la sagesse qu'une maison s'élève. Donne-moi l'intelligence pour gérer mon foyer, mes biens et mes relations. Remplis nos chambres de ce qui est précieux : la paix, la foi et l'amour. Amen.","C'est par la sagesse qu'une maison s'élève, et par l'intelligence qu'elle s'affermit ; c'est par la science que les chambres se remplissent de tous les biens précieux et agréables.","Proverbes 24:3-4","Les biens les plus précieux d'une maison ne se rangent pas dans les armoires. Ils se vivent."],["Pour l'humilité qui élève","Choisissez l'humilité, Dieu s'occupe du reste.","Seigneur, garde-moi de l'orgueil. Apprends-moi l'humilité qui reconnaît que tout vient de toi. Je crois que de l'humilité naissent la vraie richesse, la gloire et la vie. Amen.","Le fruit de l'humilité, de la crainte de l'Éternel, c'est la richesse, la gloire et la vie.","Proverbes 22:4","Salomon a reçu richesse et gloire parce qu'il s'était d'abord présenté comme « un jeune homme qui ne sait pas se conduire »."],["Pour le projet diligent","Avancez avec méthode, sans précipitation.","Éternel, donne-moi la patience de bien préparer ce que je fais. Garde-moi de la précipitation qui gâche tout. Bénis mes plans et conduis-les vers l'abondance. Amen.","Les projets de l'homme diligent ne mènent qu'à l'abondance, mais celui qui agit avec précipitation n'arrive qu'à la disette.","Proverbes 21:5","La hâte est souvent l'ennemie de la bénédiction. Prenez aujourd'hui le temps de bien faire une seule chose."],["Pour la fidélité récompensée","Restez fidèle, les bénédictions suivent.","Seigneur, rends-moi fidèle dans mes engagements, dans mon travail et dans ma foi. Garde-moi de la hâte de m'enrichir qui fait trébucher. Je veux être de ceux que tu combles de bénédictions. Amen.","Un homme fidèle est comblé de bénédictions, mais celui qui a hâte de s'enrichir ne reste pas impuni.","Proverbes 28:20","La fidélité est une semence lente, mais sa récolte est abondante."],["Pour un héritage béni","Priez pour ce que vous laisserez après vous.","Éternel, je ne veux pas seulement vivre pour aujourd'hui. Aide-moi à laisser un héritage de foi, de bonté et de stabilité à mes enfants et petits-enfants. Que ma vie soit une bénédiction qui continue après moi. Amen.","L'homme de bien a pour héritiers les enfants de ses enfants.","Proverbes 13:22","Le plus bel héritage n'est pas seulement matériel : c'est l'exemple d'une vie fidèle."],["Pour la sagesse qui vient de Dieu","Demandez la sagesse : Dieu la donne sans reproche.","Seigneur, je manque de sagesse pour ce que je vis en ce moment. Je te la demande simplement, comme un enfant demande du pain. Je crois ta promesse : tu donnes à tous, généreusement et sans reproche. Amen.","Si quelqu'un d'entre vous manque de sagesse, qu'il la demande à Dieu, qui donne à tous simplement et sans reproche, et elle lui sera donnée.","Jacques 1:5","La prière de Salomon à Gabaon reste ouverte à chacun. Il suffit de demander."],["Pour l'abondance par surcroît","Cherchez d'abord la sagesse, et recevez le reste.","Éternel, comme à Salomon, je veux te demander d'abord ce qui compte vraiment. Mais je crois aussi que tu es un Père généreux, qui donne même ce qu'on n'a pas demandé. Ouvre tes mains sur ma vie aujourd'hui. Amen.","Je te donnerai, de plus, ce que tu n'as pas demandé, des richesses et de la gloire.","1 Rois 3:13","Dieu aime surprendre ceux qui lui demandent d'abord sa sagesse. Ses dons dépassent nos demandes."],["Pour le cœur large","Demandez une intelligence vaste comme la mer.","Seigneur, élargis mon cœur et mon intelligence. Que je comprenne les autres au lieu de les juger, et que je voie plus loin que mes soucis du moment. Donne-moi une sagesse vaste comme le sable au bord de la mer. Amen.","Dieu donna à Salomon de la sagesse, une très grande intelligence, et des connaissances étendues comme le sable qui est au bord de la mer.","1 Rois 4:29","Le texte hébreu parle d'un « cœur large ». La sagesse rend généreux, patient et ouvert."],["Pour la guérison du pays","Priez pour votre pays et votre ville.","Éternel, je m'humilie devant toi pour mon pays, ma ville et mon quartier. Pardonne nos fautes, guéris nos divisions, et fais revenir la paix et la justice. Que tes yeux soient ouverts et tes oreilles attentives à notre prière. Amen.","Si mon peuple sur qui est invoqué mon nom s'humilie, prie, et cherche ma face, et s'il se détourne de ses mauvaises voies, je l'exaucerai des cieux, je lui pardonnerai son péché, et je guérirai son pays.","2 Chroniques 7:14","Cette promesse a été donnée à Salomon la nuit après la dédicace du Temple. Elle reste un appel pour chaque génération."],["Pour la présence de Dieu","Demandez qu'il ne vous abandonne jamais.","Seigneur, sois avec moi comme tu as été avec ceux qui m'ont précédé dans la foi. Ne m'abandonne pas et ne me délaisse pas. Que je sente ta présence dans les heures sombres comme dans les jours heureux. Amen.","Que l'Éternel, notre Dieu, soit avec nous, comme il a été avec nos pères ; qu'il ne nous abandonne pas et ne nous délaisse pas.","1 Rois 8:57","Salomon a prié ces mots devant tout le peuple. Faites-en votre bénédiction pour aujourd'hui."],["Pour la grandeur de Dieu","Contemplez un Dieu que les cieux ne peuvent contenir.","Éternel, les cieux des cieux ne peuvent te contenir, et pourtant tu viens habiter dans mon cœur. Merci pour ce mystère. Que mes problèmes reprennent leur vraie taille devant ta grandeur. Amen.","Mais quoi ! Dieu habiterait-il véritablement sur la terre ? Voici, les cieux et les cieux des cieux ne peuvent te contenir.","1 Rois 8:27","Quand vos soucis paraissent immenses, souvenez-vous que celui qui vous écoute est plus grand que les cieux."],["Pour la sécurité : écouter la sagesse","Vivez tranquille, sans craindre le mal.","Seigneur, je veux écouter ta voix plus que celle de mes peurs. Donne-moi de vivre tranquille, avec assurance, sans craindre aucun mal. Que ta sagesse soit mon abri jour et nuit. Amen.","Mais celui qui m'écoute reposera avec assurance, il vivra tranquille et sans craindre aucun mal.","Proverbes 1:33","Dans les Proverbes, la Sagesse parle comme une personne qui appelle. L'écouter, c'est trouver le repos."],["Pour le bouclier des justes","Placez votre intégrité sous la garde de Dieu.","Éternel, sois mon bouclier. Garde mes pas sur le chemin droit, même quand le détour paraît plus facile. Je crois que tu protèges ceux qui marchent avec intégrité. Amen.","Il tient en réserve le salut pour les hommes droits, il est un bouclier pour ceux qui marchent dans l'intégrité.","Proverbes 2:7","La droiture n'est pas toujours facile, mais elle est toujours protégée."],["Pour la santé : la sagesse qui fortifie","Demandez la santé du corps par un cœur aligné.","Seigneur, je ne veux pas être sage à mes propres yeux. Je me tourne vers toi et je laisse ce qui me fait du mal. Que cela devienne santé pour mon corps et rafraîchissement pour mes os. Amen.","Ne sois point sage à tes propres yeux, crains l'Éternel, et détourne-toi du mal : ce sera la santé pour tes muscles, et un rafraîchissement pour tes os.","Proverbes 3:7-8","Pour Salomon, l'humilité et la droiture ont des effets jusque dans le corps."],["Pour garder la Parole","Que la Parole devienne vie et santé.","Éternel, que ta Parole ne s'éloigne pas de mes yeux. Je veux la garder au fond de mon cœur, comme un trésor. Qu'elle soit vie pour mon âme et santé pour tout mon corps. Amen.","Car c'est la vie pour ceux qui les trouvent, c'est la santé pour tout leur corps.","Proverbes 4:22","Un verset médité chaque jour devient une nourriture. Choisissez-en un aujourd'hui et répétez-le."],["Pour chercher et trouver","Cherchez la sagesse, elle se laisse trouver.","Seigneur, je te cherche aujourd'hui. Je crois que ceux qui te cherchent te trouvent. Révèle-toi à moi dans ma prière, dans ta Parole et dans les événements de ma journée. Amen.","J'aime ceux qui m'aiment, et ceux qui me cherchent me trouvent.","Proverbes 8:17","La Sagesse n'est pas cachée à ceux qui la désirent. Elle vient à la rencontre de ceux qui la cherchent."],["Pour la valeur de la sagesse","Préférez la sagesse aux perles.","Éternel, apprends-moi à désirer ce qui a vraiment de la valeur. Que je cherche la sagesse plus que l'argent, la paix plus que le confort, et ta présence plus que tout. Amen.","Car la sagesse vaut mieux que les perles, elle a plus de valeur que tous les objets de prix.","Proverbes 8:11","Salomon possédait tous les trésors de son époque. Il savait lequel valait le plus."],["Pour le bonheur du sage","Recevez la joie promise à celui qui trouve la sagesse.","Seigneur, je veux faire partie de ceux que tu appelles heureux. Donne-moi la sagesse et l'intelligence pour vivre bien, aimer bien et choisir bien. Amen.","Heureux l'homme qui a trouvé la sagesse, et l'homme qui possède l'intelligence !","Proverbes 3:13","Le bonheur, selon Salomon, ne se trouve pas dans ce que l'on possède, mais dans la manière de vivre."],["Pour faire le bien maintenant","Ne repoussez pas le bien que vous pouvez faire.","Éternel, montre-moi aujourd'hui le bien que je peux faire tout de suite. Que je ne remette pas à demain un service, une visite ou un remboursement. Que ma main soit ouverte quand j'en ai le pouvoir. Amen.","Ne refuse pas un bienfait à celui qui y a droit, quand tu as le pouvoir de l'accorder.","Proverbes 3:27","Le bien différé devient souvent le bien oublié. Faites-le aujourd'hui."],["Pour la crainte des autres","Libérez-vous du regard des autres.","Seigneur, j'ai souvent peur de ce que les autres pensent de moi. Libère-moi de ce piège. Que je cherche à te plaire à toi d'abord, et que ta protection me donne l'assurance d'être moi-même. Amen.","La crainte des hommes tend un piège, mais celui qui se confie en l'Éternel est protégé.","Proverbes 29:25","Le regard des autres peut nous paralyser. Le regard de Dieu nous libère."],["Pour la Parole éprouvée","Appuyez-vous sur une promesse qui ne trompe pas.","Éternel, toute ta parole est éprouvée. Quand tout vacille, je m'appuie sur ta promesse. Sois mon bouclier, car je cherche en toi mon refuge. Amen.","Toute parole de Dieu est éprouvée. Il est un bouclier pour ceux qui cherchent en lui un refuge.","Proverbes 30:5","Une promesse éprouvée est une promesse qui a déjà résisté au feu. Vous pouvez vous y appuyer."],["Pour aujourd'hui seulement","Vivez ce jour-ci avec Dieu, sans vous inquiéter de demain.","Seigneur, je ne sais pas ce que demain me réserve. Je te confie ce jour, et seulement ce jour. Donne-moi la force pour aujourd'hui, la joie pour aujourd'hui et la paix pour aujourd'hui. Amen.","Ne te vante pas du lendemain, car tu ne sais pas ce qu'un jour peut enfanter.","Proverbes 27:1","La sagesse de Salomon invite à l'humilité face à l'avenir, et à la pleine attention au présent."],["Pour la justice et la bonté","Poursuivez ce qui fait vivre.","Éternel, je veux poursuivre la justice et la bonté. Montre-moi aujourd'hui où je peux être juste et bon : dans un regard, une parole, une décision. Et accorde-moi la vie que tu promets. Amen.","Celui qui poursuit la justice et la bonté trouve la vie, la justice et la gloire.","Proverbes 21:21","Ce que l'on poursuit finit par nous façonner. Choisissez de poursuivre le bien."],["Pour la vengeance laissée à Dieu","Remettez-lui ce que vous voudriez rendre.","Seigneur, j'ai été blessé et j'ai envie de rendre le mal. Je dépose ce désir devant toi. J'espère en toi, et je crois que tu me délivreras à ta manière. Amen.","Ne dis pas : Je rendrai le mal. Espère en l'Éternel, et il te délivrera.","Proverbes 20:22","Laisser Dieu agir, ce n'est pas abandonner la justice. C'est la confier à celui qui voit tout."],["Pour la mère de famille","Bénissez celle qui bâtit sa maison.","Éternel, je te confie les mères et les femmes qui portent leur famille. Donne-leur la sagesse pour bâtir, la patience pour durer et la force quand tout repose sur elles. Amen.","La femme sage bâtit sa maison, et la femme insensée la renverse de ses propres mains.","Proverbes 14:1","Chaque geste patient est une pierre posée. Les maisons se bâtissent jour après jour."],["Pour la main ouverte","Tendez la main à celui qui souffre.","Seigneur, ouvre ma main et mon cœur à ceux qui souffrent autour de moi. Que je ne détourne pas le regard du malheureux. Fais de moi un instrument de ta tendresse. Amen.","Elle tend la main au malheureux, elle tend la main à l'indigent.","Proverbes 31:20","La force de la femme vertueuse se voit aussi dans sa compassion. La vraie grandeur est généreuse."],["Pour la beauté intérieure","Cherchez ce qui ne passe pas.","Éternel, le temps passe et mon corps change. Aide-moi à ne pas m'attacher à ce qui s'efface. Rends-moi beau à l'intérieur, par la foi, la bonté et la paix. Amen.","La grâce est trompeuse, et la beauté est vaine ; la femme qui craint l'Éternel est celle qui sera louée.","Proverbes 31:30","Ce qui reste, quand tout le reste passe, c'est un cœur tourné vers Dieu."],["Pour la parole dite à propos","Demandez le bon mot au bon moment.","Seigneur, donne-moi le bon mot au bon moment. Que je sache me taire quand il faut et parler quand il faut. Que mes paroles soient comme des pommes d'or sur des ciselures d'argent. Amen.","Comme des pommes d'or sur des ciselures d'argent, ainsi est une parole dite à propos.","Proverbes 25:11","Une parole juste au bon moment est un bijou. Elle peut changer une vie."],["Pour l'acquisition de la sagesse","Investissez dans ce qui ne se perd pas.","Éternel, de tout ce que je peux acquérir, je veux d'abord la sagesse. Donne-moi le désir d'apprendre, de grandir et de comprendre. Que je ne cesse jamais d'être ton élève. Amen.","Voici le commencement de la sagesse : acquiers la sagesse, et avec tout ce que tu possèdes acquiers l'intelligence.","Proverbes 4:7","Il n'y a pas d'âge pour apprendre. La sagesse s'acquiert chaque jour, jusqu'au dernier."],["Pour apprendre de la fourmi","Avancez avec constance, même sans être vu.","Seigneur, donne-moi la constance de la fourmi : travailler sans bruit, préparer l'avenir, avancer chaque jour. Garde-moi de la paresse et du découragement. Amen.","Va vers la fourmi, paresseux ; considère ses voies, et deviens sage.","Proverbes 6:6","Salomon observait la création pour en tirer des leçons. Les plus petites créatures enseignent les plus grandes vérités."],["Pour le commencement de la sagesse","Mettez Dieu au début de toute chose.","Éternel, je veux commencer cette journée en te donnant la première place. Que ma sagesse commence par le respect de toi, et que mon intelligence grandisse en te connaissant mieux. Amen.","Le commencement de la sagesse, c'est la crainte de l'Éternel ; et la science des saints, c'est l'intelligence.","Proverbes 9:10","La « crainte de l'Éternel » n'est pas la peur : c'est l'émerveillement respectueux devant sa grandeur."],["Pour un temps pour tout","Acceptez la saison que vous traversez.","Seigneur, je ne comprends pas toujours la saison que je traverse. Aide-moi à accepter qu'il y a un temps pour pleurer et un temps pour rire, un temps pour attendre et un temps pour recevoir. Je te fais confiance pour le calendrier de ma vie. Amen.","Il y a un temps pour tout, un temps pour toute chose sous les cieux.","Ecclésiaste 3:1","Aucune saison ne dure pour toujours. Celle que vous vivez prépare la suivante."],["Pour les larmes et le rire","Confiez à Dieu vos larmes : la joie reviendra.","Éternel, tu vois mes larmes, et tu les comptes. Console-moi dans ce temps de tristesse, et prépare le temps du rire. Je crois que la danse reviendra après les lamentations. Amen.","Un temps pour pleurer, et un temps pour rire ; un temps pour se lamenter, et un temps pour danser.","Ecclésiaste 3:4","Pleurer n'est pas manquer de foi. Même les larmes ont leur temps, et elles ne sont pas le dernier mot."],["Pour ne pas être seul","Demandez des compagnons de route.","Seigneur, deux valent mieux qu'un. Je te remercie pour ceux qui marchent avec moi. Si je suis seul, envoie-moi quelqu'un pour me relever quand je tombe, et que je sois moi-même un soutien pour un autre. Amen.","Deux valent mieux qu'un, parce qu'ils retirent un bon salaire de leur travail. Car, s'ils tombent, l'un relève son compagnon.","Ecclésiaste 4:9-10","Nous n'avons pas été créés pour marcher seuls. Aujourd'hui, appelez quelqu'un qui est peut-être seul."],["Pour le lien qui ne rompt pas","Placez Dieu au cœur de vos liens.","Éternel, sois le troisième fil de mes relations : dans mon couple, dans mon amitié, dans ma famille. Avec toi au milieu, notre lien ne se rompra pas facilement. Amen.","Et la corde à trois fils ne se rompt pas facilement.","Ecclésiaste 4:12","Une relation dans laquelle Dieu est invité devient plus solide que la somme de ceux qui la forment."],["Pour semer avec foi","Donnez aujourd'hui, la moisson viendra.","Seigneur, je veux jeter mon pain sur la face des eaux : semer sans calculer, donner sans attendre de retour immédiat. Je crois qu'avec le temps, je retrouverai ce que j'ai semé. Amen.","Jette ton pain sur la face des eaux, car avec le temps tu le retrouveras.","Ecclésiaste 11:1","Les semences de bonté voyagent loin. Elles reviennent souvent quand on ne les attend plus."],["Pour la fin meilleure que le début","Croyez que la fin sera meilleure.","Éternel, ce que je vis a mal commencé, mais je crois que la fin peut être meilleure. Donne-moi un esprit patient plutôt qu'un esprit hautain, et conduis cette histoire vers une belle fin. Amen.","Mieux vaut la fin d'une chose que son commencement ; mieux vaut un esprit patient qu'un esprit hautain.","Ecclésiaste 7:8","Ne jugez pas votre histoire sur son premier chapitre. Dieu écrit aussi les fins."],["Pour le repos des bien-aimés","Recevez le repos que Dieu donne.","Seigneur, je me fatigue à me lever tôt et à me coucher tard, en mangeant le pain de l'inquiétude. Je veux te faire confiance. Donne-moi le repos que tu offres à tes bien-aimés, même pendant mon sommeil. Amen.","Il en donne autant à ses bien-aimés pendant leur sommeil.","Psaume 127:2","Dieu continue d'agir pendant que vous dormez. Votre repos est aussi un acte de foi."],["Pour les enfants, héritage de Dieu","Remerciez pour vos enfants et confiez-les.","Éternel, merci pour les enfants que tu m'as confiés, ou que tu as mis sur ma route. Ils sont ton héritage. Bénis-les, protège-les et accomplis ton plan pour chacun d'eux. Amen.","Voici, des fils sont un héritage de l'Éternel, le fruit des entrailles est une récompense.","Psaume 127:3","Chaque enfant est un trésor confié, pas une possession. Le confier à Dieu, c'est le remettre en de bonnes mains."],["Pour celui qui crie","Dieu entend le cri du malheureux.","Seigneur, aujourd'hui je crie vers toi, et je n'ai personne d'autre pour m'aider. Délivre-moi comme tu délivres le pauvre qui t'appelle. Je crois que tu ne m'abandonnes pas. Amen.","Car il délivrera le pauvre qui crie, et le malheureux qui n'a point d'aide.","Psaume 72:12","Ce psaume de Salomon décrit un roi qui écoute les plus faibles. C'est le cœur même de Dieu."],["Pour le sceau sur le cœur","Demandez que Dieu grave son amour en vous.","Éternel, mets-moi comme un sceau sur ton cœur, et mets ton amour comme un sceau sur le mien. Que rien ne puisse effacer cette alliance. Je suis à toi, et tu es à moi. Amen.","Mets-moi comme un sceau sur ton cœur, comme un sceau sur ton bras ; car l'amour est fort comme la mort.","Cantique des cantiques 8:6","Dans l'Antiquité, le sceau d'un roi garantissait l'authenticité et la protection. Vous êtes marqué de son amour."],["Pour l'amitié plus forte qu'un frère","Remerciez pour l'ami fidèle.","Seigneur, merci pour l'ami qui m'est plus attaché qu'un frère. Bénis-le aujourd'hui. Et rappelle-moi que tu es, toi aussi, cet ami fidèle qui ne m'abandonne jamais. Amen.","Il est tel ami plus attaché qu'un frère.","Proverbes 18:24","Certains liens choisis sont aussi forts que ceux du sang. Ils sont un reflet de l'amitié de Dieu."],["Pour le travailleur fatigué","Recevez le sommeil doux après l'effort.","Éternel, j'ai travaillé dur aujourd'hui. Merci pour la force que tu m'as donnée. Donne-moi maintenant un sommeil doux et réparateur, et que demain je me lève avec une énergie nouvelle. Amen.","Le sommeil du travailleur est doux, qu'il ait peu ou beaucoup à manger.","Ecclésiaste 5:12","Le repos après un travail honnête est une bénédiction que l'argent ne peut pas acheter."],["Pour la joie que Dieu donne","Recevez la sagesse, la science et la joie.","Seigneur, je veux te plaire, et je reçois avec gratitude ce que tu donnes : la sagesse pour comprendre, la science pour agir et la joie pour vivre. Remplis ma journée de ces trois trésors. Amen.","Car il donne à l'homme qui lui est agréable la sagesse, la science et la joie.","Ecclésiaste 2:26","La joie n'est pas une récompense lointaine. C'est un don que Dieu fait aujourd'hui à ceux qui marchent avec lui."],["Pour la fin du discours","Revenez à l'essentiel.","Éternel, après tout ce que j'ai cherché, je reviens à l'essentiel : te respecter et suivre tes chemins. Simplifie ma vie, enlève ce qui m'éloigne de toi, et garde-moi dans ce qui compte vraiment. Amen.","Écoutons la fin du discours : Crains Dieu et observe ses commandements. C'est là ce que doit faire tout homme.","Ecclésiaste 12:13","Après avoir tout essayé, Salomon conclut par la simplicité. L'essentiel tient en une phrase."],["Pour la promesse tenue","Dieu n'oublie aucune de ses bonnes paroles.","Seigneur, aucune de tes bonnes paroles n'est restée sans effet. Je te rappelle aujourd'hui la promesse que j'attends. Je crois que tu es fidèle, et que tu accompliras ce que tu as dit. Amen.","De toutes les bonnes paroles qu'il avait prononcées par Moïse, son serviteur, aucune n'est restée sans effet.","1 Rois 8:56","Salomon a constaté, devant tout le peuple, que Dieu avait tenu chacune de ses promesses. Il tiendra aussi les vôtres."],["Pour des oreilles attentives","Croyez que Dieu entend la prière faite dans son lieu.","Éternel, je viens dans ton lieu secret, ici, dans mon cœur. Que tes yeux soient ouverts sur ma vie et tes oreilles attentives à ma prière. Je te parle comme à un ami qui écoute. Amen.","Mes yeux seront ouverts désormais, et mes oreilles seront attentives à la prière faite en ce lieu.","2 Chroniques 7:15","Le Temple n'existe plus, mais la promesse demeure : Dieu écoute là où on le cherche sincèrement."],["Pour le cœur sage et intelligent","Recevez ce que Dieu a promis à Salomon.","Seigneur, comme tu l'as dit à Salomon, donne-moi un cœur sage et intelligent. Que je voie les situations avec tes yeux et que je les traverse avec ta paix. Amen.","Voici, je te donne un cœur sage et intelligent.","1 Rois 3:12","Dieu a répondu à Salomon dans un songe. Il répond encore à ceux qui lui demandent un cœur sage."],["Pour la connaissance qui vient de sa bouche","Ouvrez votre cœur à l'enseignement de Dieu.","Éternel, c'est toi qui donnes la sagesse. Parle-moi aujourd'hui, par ta Parole, par une rencontre ou dans le silence. Que je reçoive la connaissance et l'intelligence qui sortent de ta bouche. Amen.","Car l'Éternel donne la sagesse ; de sa bouche sortent la connaissance et l'intelligence.","Proverbes 2:6","La sagesse n'est pas seulement le fruit de l'expérience : elle est un don de Dieu, offert chaque jour."],["Pour bénir sa langue","Engagez-vous à prononcer des paroles de vie.","Seigneur, aujourd'hui je décide de prononcer la vie : sur moi, sur ma famille et sur mon avenir. Je renonce aux paroles de malédiction et de découragement. Que ma bouche soit remplie de foi. Amen.","La mort et la vie sont au pouvoir de la langue.","Proverbes 18:21","Faites l'expérience aujourd'hui : chaque fois que vous allez vous plaindre, transformez la phrase en prière."],["Pour la diligence récompensée","Faites aujourd'hui votre part avec soin.","Éternel, je fais ma part et je te confie la tienne. Bénis le travail de mes mains, multiplie mes efforts et ouvre-moi des opportunités nouvelles. Amen.","La main des diligents enrichit.","Proverbes 10:4","Dieu bénit ce que nous faisons, pas ce que nous rêvons de faire. Faites un pas concret aujourd'hui."],["Pour la prospérité sans chagrin","Demandez une abondance qui apporte la paix.","Seigneur, je ne veux pas une richesse qui m'éloigne de toi ou qui détruit ma famille. Donne-moi la prospérité qui vient de toi, celle qui n'ajoute aucun chagrin. Amen.","C'est la bénédiction de l'Éternel qui enrichit, et il ne la fait suivre d'aucun chagrin.","Proverbes 10:22","Ce verset résume la prospérité selon Salomon : venue de Dieu, elle ne coûte pas la paix."],["Pour le pas dirigé par Dieu","Laissez-le diriger vos pas.","Éternel, mon cœur fait des plans, mais c'est toi qui diriges mes pas. Je te donne le contrôle de ma journée. Conduis-moi vers les bonnes personnes, les bonnes portes et les bonnes décisions. Amen.","Le cœur de l'homme médite sa voie, mais c'est l'Éternel qui dirige ses pas.","Proverbes 16:9","Faites vos plans, puis lâchez prise. Dieu sait ajuster votre route en chemin."],["Pour la protection des voyageurs","Confiez à Dieu ceux qui sont sur la route.","Seigneur, je te confie tous ceux que j'aime et qui sont sur la route aujourd'hui. Garde-les des accidents et des mauvaises rencontres, et ramène-les sains et saufs à la maison. Amen.","Le nom de l'Éternel est une tour forte ; le juste s'y réfugie, et se trouve en sûreté.","Proverbes 18:10","Là où vous ne pouvez pas accompagner ceux que vous aimez, la prière les accompagne."],["Pour la nuit paisible des enfants","Bénissez le sommeil de vos enfants et petits-enfants.","Éternel, je te confie le sommeil de mes enfants et petits-enfants. Chasse les cauchemars et les peurs. Que tes anges veillent sur eux, et qu'ils se réveillent en paix. Amen.","Si tu te couches, tu seras sans crainte ; et quand tu seras couché, ton sommeil sera doux.","Proverbes 3:24","Ce soir, prononcez ce verset sur ceux que vous aimez. C'est une bénédiction simple et puissante."],["Pour la bénédiction du matin","Commencez la journée sous la main de Dieu.","Seigneur, je te donne cette journée avant qu'elle commence. Bénis mon entrée et ma sortie, mes rencontres et mes tâches. Que tout ce que je fais aujourd'hui soit fait avec toi. Amen.","Reconnais-le dans toutes tes voies, et il aplanira tes sentiers.","Proverbes 3:6","Les premières minutes de la journée donnent le ton. Offrez-les à Dieu."],["Pour remercier le Roi des rois","Terminez en louant celui qui a tout donné.","Éternel, Roi des rois, je te remercie pour tout ce que tu as fait dans ma vie, même ce que je n'ai pas remarqué. Tu es fidèle, généreux et bon. Que ma vie soit un chant de reconnaissance. Amen.","Béni soit l'Éternel, qui a donné du repos à son peuple, selon toutes ses promesses !","1 Rois 8:56","Salomon, le plus grand roi d'Israël, s'est agenouillé devant un Roi plus grand. La louange remet chaque chose à sa place."]].map(([t,d,p,v,r,x])=>({t,d,p,v,r,x}));

function tkFlush(final){if(!API_URL||!TK.q.length||(TK.busy&&!final))return;

 // text/plain = requête « simple » (pas de pré-vérification CORS), fiable même quand la page se ferme
 fetch(API_URL+'/api/events',{method:'POST',keepalive:!!final,headers:{'Content-Type':'text/plain'},body:JSON.stringify({tok:S.tok||null,ev:batch})})
  .then(r=>{if(r.ok){TK.q.splice(0,batch.length);TK.keep();if(TK.q.length)setTimeout(tkFlush,300)}})

 h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),em=Math.floor((h+l-7*m+114)/31)-1,ed=(h+l-7*m+114)%31+1;
 const E=new Date(y,em,ed),plus=n=>new Date(y,em,ed+n),adv=new Date(y,11,3);adv.setDate(adv.getDate()-adv.getDay());

S.df=S.df||{start:'',done:[],last:'',notes:{}};

 </div></section>
 <p class="tquote">Un seul pas par jour. Dieu fait le reste.</p>
 ${DF_WEEKS.map((w,wi)=>{const ds=DF.slice(wi*7,wi*7+7),k=ds.filter((_,j)=>S.df.done.includes(wi*7+j+1)).length;
  return `<div class="d21wk"><div class="d21wh"><span class="d21wi">${w[0]}</span><div class="grow"><span class="eyebrow">Semaine ${wi+1} · Jours ${wi*7+1}–${wi*7+7}</span><h2>${w[1]}</h2><span class="small soft">${w[2]}</span></div><span class="d21wc ${k===7?'ok':''}">${k}/7</span></div>

const GUIDE_RULES=`Tu es l'assistant virtuel du ${PERE}, dans l'application Prière Sacrée du Roi Salomon (prières et leçons de spiritualité chrétienne inspirées de la sagesse du roi Salomon). Tu écris comme dans une messagerie : messages courts, chaleureux, simples, 60 mots maximum, sans titres ni listes.
Tu es un assistant automatique : tu n'es ni un prêtre ni une personne. Ne prétends jamais être le ${PERE} lui-même ni un être humain, et si on te demande qui tu es, dis-le clairement. Tu ne donnes pas de sacrements, d'absolution ni de direction spirituelle personnelle.
Réponds dans la langue de la personne (français par défaut).
L'application : Accueil (Grande Prière du Roi Salomon, Mes programmes, Bonus) ; Programmes (vidéos et prières à faire glisser) ; Prières Quotidiennes (prière du jour, thème du mois, journal) ; dans Programmes : Nombres Puissants (oracle des nombres, horloge, votre nombre) et Focus du Jour (une intention par jour) ; Bonus. Une nouvelle prière de Saint Antoine s'ouvre chaque jour. Le compte et le remboursement sont dans le rond en haut à droite de l'Accueil.
Programmes vidéo : ${P.map(p=>p.t).join(' ; ')}.
Règles : pour une commande, un paiement ou un accès perdu, n'invente rien et oriente vers l'équipe à ${SUPPORT} (réponse sous 24 heures) ; pour un remboursement, indique le rond en haut à droite de l'Accueil et ne propose aucun achat. Ne promets jamais de résultat financier, de guérison ou de délai ; aucun conseil médical, juridique ou financier. En cas de détresse grave, invite avec douceur à contacter un proche ou les services d'urgence. Si tu ne sais pas, dis-le.`;
function fallback(q){q=q.toLowerCase();
 if(/rembours/.test(q))return "Vous pouvez demander un remboursement depuis le rond en haut à droite de l'Accueil. L'équipe répond sous 24 heures.";
 if(/paiement|commande|factur|achat/.test(q))return "Pour votre commande, notre équipe vous répond sous 24 heures à "+SUPPORT+".";
 if(/ouvrir|connexion|connecter|accès|charge|vidéo|audio/.test(q))return "Fermez puis rouvrez l'application. Si la vidéo ne s'ouvre toujours pas, écrivez à "+SUPPORT+" en indiquant son nom.";
 if(/commenc|début|aujourd/.test(q))return "Commencez par la Grande Prière du Roi Salomon, sur l'Accueil. Elle débloque vos premières leçons.";
 return "Je suis là pour vous aider avec l'application et votre parcours. Pouvez-vous préciser votre question ?"}
async function ask(q){
 q=q.trim();if(!q||V.busy)return;V.busy=true;V.chat.push({r:'user',c:q,h:hhmm()});V.tab='guide';render();
 const box=document.createElement('div');box.className='msg a typing';box.innerHTML='<i></i><i></i><i></i>';$('#msgs').appendChild(box);
 const v=$('#view');v.scrollTop=v.scrollHeight;let ans='';
 await new Promise(r=>setTimeout(r,1100));
 const show=t=>{box.className='msg a';box.textContent=t;v.scrollTop=v.scrollHeight};
 try{if(!sample)throw 0;
  const hist=V.chat.slice(-9,-1).map(m=>(m.r==='user'?'Personne : ':'Assistant : ')+m.c).join('\n');
  const r=await sample(`${GUIDE_RULES}\nPrénom : ${first()}.\n${hist?'Conversation jusqu\'ici :\n'+hist+'\n':''}Message de la personne : ${q}\nRéponds uniquement par le message de l'assistant.`,
   {cache:false,modelTier:'quick',onText:({text})=>show(text)});ans=r.text;
 }catch(e){ans=fallback(q)}
 V.chat.push({r:'assistant',c:ans,h:hhmm()});V.busy=false;if(V.tab==='guide')render();
}

// starry sky: twinkling stars drifting slowly upward, a few gold ones, an occasional shooting star
{const c=document.createElement('canvas'),x=c.getContext('2d'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
 $('#sky').appendChild(c);let W,H,stars=[],shoot=null,next=3500;
 const size=()=>{const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*r;c.height=H*r;x.setTransform(r,0,0,r,0,0);
  stars=Array.from({length:Math.min(Math.round(W*H/4200),320)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()<.1?1.5:Math.random()*.9+.3,
   a:.3+Math.random()*.65,p:Math.random()*6.28,s:.5+Math.random()*1.8,g:Math.random()<.16,v:.8+Math.random()*2.4}));if(still)draw(0)};
 function draw(t){x.clearRect(0,0,W,H);
  for(const s of stars){const tw=still?1:.5+.5*Math.sin(t/1000*s.s+s.p);let y=still?s.y:(s.y-t/1000*s.v)%H;if(y<0)y+=H;
   x.fillStyle=s.g?'#e9cd8f':'#ffffff';x.globalAlpha=s.a*tw;x.beginPath();x.arc(s.x,y,s.r,0,6.29);x.fill();
   if(s.r>1.2){x.globalAlpha=s.a*tw*.16;x.beginPath();x.arc(s.x,y,s.r*4.5,0,6.29);x.fill()}}
  if(!still){if(!shoot&&t>next)shoot={x:Math.random()*W*.7,y:Math.random()*H*.35,t0:t};
   if(shoot){const k=(t-shoot.t0)/900;if(k>=1){shoot=null;next=t+7000+Math.random()*9000}else{const px=shoot.x+k*W*.45,py=shoot.y+k*H*.22,
     g=x.createLinearGradient(px,py,px-90,py-44);g.addColorStop(0,'rgba(255,255,255,'+(1-k)+')');g.addColorStop(1,'rgba(255,255,255,0)');
     x.globalAlpha=1;x.strokeStyle=g;x.lineWidth=1.6;x.lineCap='round';x.beginPath();x.moveTo(px,py);x.lineTo(px-90,py-44);x.stroke()}}
   x.globalAlpha=1;requestAnimationFrame(draw)}}
 addEventListener('resize',size);size();if(!still)requestAnimationFrame(draw)}
